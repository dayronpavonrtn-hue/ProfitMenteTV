name: ProfitMente Studio Media Integrity QA

on:
  push:
    paths:
      - 'studio/qa-engine.js'
      - 'studio/test_media_integrity_qa.mjs'
      - '.github/workflows/media-integrity-qa.yml'
  workflow_dispatch:

jobs:
  media-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check QA syntax
        run: node --check studio/qa-engine.js
      - name: Run media integrity regression
        run: node studio/test_media_integrity_qa.mjs
      - name: Run existing track-state QA
        run: node studio/test_track_state_qa.mjs
