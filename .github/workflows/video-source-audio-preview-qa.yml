name: ProfitMente Studio Video Source Audio Preview QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/audio-engine.js'
      - 'studio/test_video_source_audio_preview.mjs'
      - '.github/workflows/video-source-audio-preview-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audio-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/audio-engine.js
      - name: Video source audio preview regression
        run: node studio/test_video_source_audio_preview.mjs
