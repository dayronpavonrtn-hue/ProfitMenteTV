name: ProfitMente Studio Media Placement Atomic QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/media-placement-engine.js'
      - 'studio/media-placement-integration.js'
      - 'studio/test_media_placement.mjs'
      - 'studio/test_media_placement_atomicity.mjs'
      - '.github/workflows/studio-media-placement-atomic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-placement-atomic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check placement syntax
        run: |
          node --check studio/media-placement-engine.js
          node --check studio/media-placement-integration.js
      - name: Verify existing insert and overwrite behavior
        run: node studio/test_media_placement.mjs
      - name: Verify strict identity and atomic rollback
        run: node studio/test_media_placement_atomicity.mjs
      - name: Verify zero-cost local implementation
        run: |
          ! grep -Eiq "(stripe|runway|replicate|openai|anthropic|paid api|billing)" studio/media-placement-engine.js studio/media-placement-integration.js
