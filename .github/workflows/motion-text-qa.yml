name: Motion Text QA
on:
  push:
    paths:
      - 'studio/motion-text-engine.js'
      - 'studio/motion_text_layout.py'
      - 'studio/render_motion_text.py'
      - 'studio/render_bundle.py'
      - 'studio/generator-engine.js'
      - 'studio/qa-engine.js'
      - 'studio/test_motion_text.mjs'
      - 'studio/test_motion_text_render.py'
      - '.github/workflows/motion-text-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check studio/motion-text-engine.js
          node --check studio/generator-engine.js
          node --check studio/qa-engine.js
      - name: Python syntax
        run: python -m py_compile studio/motion_text_layout.py studio/render_motion_text.py studio/render_bundle.py studio/test_motion_text_render.py
      - name: Motion engine regression
        run: node studio/test_motion_text.mjs
      - name: FFmpeg availability
        run: ffmpeg -version | head -1
      - name: Motion MP4 render regression
        run: python studio/test_motion_text_render.py
