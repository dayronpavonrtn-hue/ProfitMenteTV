name: ProfitMente Studio Startup Recovery QA
on:
  push:
    paths:
      - 'studio/startup-project-guard.js'
      - 'studio/index.html'
      - 'studio/history-engine.js'
      - 'studio/test_startup_corruption_guard.mjs'
      - '.github/workflows/startup-recovery-qa.yml'
  workflow_dispatch:
jobs:
  startup-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/startup-project-guard.js
          node --check studio/history-engine.js
      - name: Startup corruption regression
        run: node studio/test_startup_corruption_guard.mjs
      - name: Startup wiring check
        run: node -e "const fs=require('fs');const h=fs.readFileSync('studio/index.html','utf8');if(h.indexOf('startup-project-guard.js')<0||h.indexOf('startup-project-guard.js')>h.indexOf('app.js'))process.exit(1)"
      - name: Existing recovery regression
        run: node studio/test_recovery.mjs
      - name: Existing project library regression
        run: node studio/test_project_library.mjs
