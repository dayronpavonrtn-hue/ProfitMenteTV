name: ProfitMente Studio Startup Recovery QA
on:
  push:
    paths:
      - 'studio/history-engine.js'
      - 'studio/test_startup_corruption_guard.mjs'
      - '.github/workflows/startup-recovery-qa.yml'
  workflow_dispatch:
jobs:
  startup-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/history-engine.js
      - name: Startup corruption regression
        run: node studio/test_startup_corruption_guard.mjs
      - name: Existing recovery regression
        run: node studio/test_recovery.mjs
      - name: Existing project library regression
        run: node studio/test_project_library.mjs
