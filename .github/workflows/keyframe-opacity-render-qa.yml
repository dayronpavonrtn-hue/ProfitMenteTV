name: ProfitMente Studio Keyframe Opacity Render QA

on:
  push:
    paths:
      - 'studio/render_mp4.py'
      - 'studio/preview-engine.js'
      - 'studio/test_keyframe_opacity_render.py'
      - '.github/workflows/keyframe-opacity-render-qa.yml'
  pull_request:
    paths:
      - 'studio/render_mp4.py'
      - 'studio/preview-engine.js'
      - 'studio/test_keyframe_opacity_render.py'
      - '.github/workflows/keyframe-opacity-render-qa.yml'

jobs:
  keyframe-opacity-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Python syntax
        run: python -m py_compile studio/render_mp4.py studio/test_keyframe_opacity_render.py
      - name: Keyframed opacity render regression
        run: python studio/test_keyframe_opacity_render.py
