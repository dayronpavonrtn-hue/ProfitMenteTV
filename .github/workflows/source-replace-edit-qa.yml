name: ProfitMente Studio Source Replace Edit QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/media-replace-engine.js'
      - 'studio/media-replace-integration.js'
      - 'studio/source-monitor-integration.js'
      - 'studio/test_source_replace_edit.mjs'
      - '.github/workflows/source-replace-edit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-replace-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check studio/media-replace-engine.js
          node --check studio/media-replace-integration.js
          node --check studio/source-monitor-integration.js
      - name: Source replace edit regression
        run: node studio/test_source_replace_edit.mjs
      - name: Source monitor wiring
        run: |
          grep -q 'data-sm-replace' studio/source-monitor-integration.js
          grep -q 'replaceFromRange' studio/source-monitor-integration.js
          grep -q 'replaceFromRange' studio/media-replace-integration.js
      - name: Zero-cost boundary
        run: |
          ! grep -Eiq 'openai|runway|replicate|stripe|paypal|api[_-]?key|authorization:|bearer ' studio/media-replace-engine.js studio/media-replace-integration.js studio/source-monitor-integration.js
