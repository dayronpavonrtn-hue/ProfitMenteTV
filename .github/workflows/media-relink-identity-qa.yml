name: ProfitMente Studio Media Relink Identity QA

on:
  push:
    paths:
      - 'studio/media-library-tools.js'
      - 'studio/media-library-meta-identity-guard.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_media_library_meta_identity_guard.mjs'
      - '.github/workflows/media-relink-identity-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/media-library-tools.js
          node --check studio/media-library-meta-identity-guard.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_media_library_meta_identity_guard.mjs
      - name: Media relink identity regression
        run: node studio/test_media_library_meta_identity_guard.mjs
      - name: Verify bootstrap wiring
        run: grep -F "media-library-meta-identity-guard.js" studio/feature-bootstrap.js
