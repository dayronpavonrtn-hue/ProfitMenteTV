name: ProfitMente Studio Folder Relink QA

on:
  push:
    paths:
      - 'studio/relink-engine.js'
      - 'studio/relink-manifest-regression.js'
      - '.github/workflows/folder-relink-qa.yml'
  pull_request:
    paths:
      - 'studio/relink-engine.js'
      - 'studio/relink-manifest-regression.js'
      - '.github/workflows/folder-relink-qa.yml'

jobs:
  relink-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/relink-engine.js
      - name: Path-aware relink regression
        run: node studio/relink-manifest-regression.js
      - name: Media import syntax parity
        run: node --check studio/media-import-engine.js
