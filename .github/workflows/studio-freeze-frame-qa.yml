name: ProfitMente Studio Freeze Frame QA
on:
  push:
    paths:
      - 'studio/freeze-frame-engine.js'
      - 'studio/freeze-frame-integration.js'
      - 'studio/test_freeze_frame.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/studio-freeze-frame-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/freeze-frame-engine.js
          node --check studio/freeze-frame-integration.js
          node --check studio/feature-bootstrap.js
      - name: Freeze frame regression
        run: node studio/test_freeze_frame.mjs
