name: ProfitMente Studio Razor All QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/razor-all-engine.js'
      - 'studio/razor-all-integration.js'
      - 'studio/test_razor_all.mjs'
      - 'studio/split-edit-engine.js'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/studio-razor-all-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  razor-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Razor All syntax
        run: |
          node --check studio/razor-all-engine.js
          node --check studio/razor-all-integration.js
          node --check studio/feature-bootstrap.js
      - name: Verify atomic multi-track cuts
        run: node studio/test_razor_all.mjs
      - name: Verify Studio wiring
        run: |
          grep -q "razor-all-engine.js" studio/feature-bootstrap.js
          grep -q "razor-all-integration.js" studio/feature-bootstrap.js
          grep -q "Shift+S" studio/razor-all-integration.js
      - name: Verify zero-cost local implementation
        run: |
          ! grep -Eiq "(stripe|runway|replicate|openai|anthropic|paid api|billing)" studio/razor-all-engine.js studio/razor-all-integration.js
