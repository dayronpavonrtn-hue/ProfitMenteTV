name: ProfitMente Studio Preview Seek QA

on:
  push:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/preview-seek-regression.test.js'
      - '.github/workflows/preview-seek-qa.yml'
  pull_request:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/preview-seek-regression.test.js'
      - '.github/workflows/preview-seek-qa.yml'
  workflow_dispatch:

jobs:
  preview-seek-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview engine syntax
        run: node --check studio/preview-engine.js
      - name: Check stale-frame regression
        run: node studio/preview-seek-regression.test.js
