name: ProfitMente Studio WebM Render State QA

on:
  push:
    paths:
      - 'studio/webm-render-engine.js'
      - 'studio/webm-render-integration.js'
      - 'studio/test_webm_render_state.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/webm-render-state-qa.yml'
  workflow_dispatch:

jobs:
  webm-render-state-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/webm-render-engine.js
          node --check studio/webm-render-integration.js
      - name: WebM render state regression
        run: node studio/test_webm_render_state.mjs
      - name: Verify Studio integration
        run: |
          grep -q "webm-render-engine.js" studio/feature-bootstrap.js
          grep -q "webm-render-integration.js" studio/feature-bootstrap.js
          grep -q "WEBM_STATE_CHANGED" studio/webm-render-integration.js
