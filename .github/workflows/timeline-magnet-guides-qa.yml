name: ProfitMente Studio Timeline Magnet QA

on:
  push:
    paths:
      - 'studio/timeline-magnet.js'
      - 'studio/test_timeline_magnet_guides.mjs'
      - 'studio/test_timeline_drag_safety.mjs'
      - '.github/workflows/timeline-magnet-guides-qa.yml'
  pull_request:
    paths:
      - 'studio/timeline-magnet.js'
      - 'studio/test_timeline_magnet_guides.mjs'
      - 'studio/test_timeline_drag_safety.mjs'
      - '.github/workflows/timeline-magnet-guides-qa.yml'
  workflow_dispatch:

jobs:
  timeline-magnet-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/timeline-magnet.js
          node --check studio/test_timeline_magnet_guides.mjs
          node --check studio/test_timeline_drag_safety.mjs
      - name: Timeline magnet regression
        run: |
          node studio/test_timeline_magnet_guides.mjs
          node studio/test_timeline_drag_safety.mjs
