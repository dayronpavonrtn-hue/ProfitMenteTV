name: ProfitMente Studio Timeline Guide Snap QA

on:
  push:
    paths:
      - 'studio/timeline-magnet.js'
      - 'studio/test_timeline_magnet_guides.mjs'
      - '.github/workflows/timeline-magnet-guides-qa.yml'
  workflow_dispatch:

jobs:
  timeline-guide-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/timeline-magnet.js
      - name: Marker and playhead snap regression
        run: node studio/test_timeline_magnet_guides.mjs
