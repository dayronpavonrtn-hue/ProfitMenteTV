name: ProfitMente Studio Preview Render Coordinator QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/preview-render-coordinator.js'
      - 'studio/test_preview_render_coordinator.mjs'
      - 'studio/feature-bootstrap.js'
      - 'studio/verify_zero_cost_release.py'
      - '.github/workflows/preview-render-coordinator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free render dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: |
          node --check studio/preview-render-coordinator.js
          node --check studio/feature-bootstrap.js
      - name: Preview coordinator regression
        run: node studio/test_preview_render_coordinator.mjs
      - name: Bootstrap wiring
        run: grep -F "preview-render-coordinator.js','ProfitMentePreviewRenderCoordinator" studio/feature-bootstrap.js
      - name: Zero-cost boundary
        run: |
          ! grep -Eiq 'openai|runway|magic.?hour|stripe|api[_-]?key|authorization:|bearer ' studio/preview-render-coordinator.js
      - name: Full ProfitMente Studio $0 release gate
        run: python studio/verify_zero_cost_release.py
