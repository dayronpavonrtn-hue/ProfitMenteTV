name: ProfitMente Studio Roll Edit QA
on:
  push:
    paths:
      - 'studio/roll-edit-engine.js'
      - 'studio/roll-edit-integration.js'
      - 'studio/test_roll_edit.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/studio-roll-edit-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/roll-edit-engine.js
          node --check studio/roll-edit-integration.js
          node --check studio/feature-bootstrap.js
      - name: Roll edit regression
        run: node studio/test_roll_edit.mjs
