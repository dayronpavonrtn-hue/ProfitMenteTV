name: ProfitMente Studio Source Monitor QA

on:
  push:
    paths:
      - 'studio/source-monitor-engine.js'
      - 'studio/source-monitor-integration.js'
      - 'studio/media-placement-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_source_monitor.mjs'
      - '.github/workflows/source-monitor-qa.yml'
  workflow_dispatch:

jobs:
  source-monitor-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check studio/source-monitor-engine.js
          node --check studio/source-monitor-integration.js
          node --check studio/media-placement-integration.js
          node --check studio/feature-bootstrap.js
      - name: Run source monitor regressions
        run: node studio/test_source_monitor.mjs
      - name: Verify source monitor wiring
        run: |
          grep -q "source-monitor-engine.js" studio/feature-bootstrap.js
          grep -q "source-monitor-integration.js" studio/feature-bootstrap.js
          grep -q "sourceOffset" studio/media-placement-integration.js
