name: ProfitMente Studio Generator Auto Fill QA

on:
  push:
    paths:
      - 'studio/generator-autofill.js'
      - 'studio/generator-engine.js'
      - 'studio/media-import-engine.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_generator_autofill.mjs'
      - 'studio/test_feature_bootstrap.mjs'
      - '.github/workflows/generator-autofill-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/generator-autofill.js
          node --check studio/feature-bootstrap.js
      - name: Generator auto fill regression
        run: node studio/test_generator_autofill.mjs
      - name: Verify bootstrap integration
        run: node studio/test_feature_bootstrap.mjs
