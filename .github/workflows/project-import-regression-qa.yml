name: Project import regression QA

on:
  push:
    paths:
      - 'studio/project-import-engine.js'
      - 'studio/project-import-integration.js'
      - 'studio/project-import-regression.test.js'
      - '.github/workflows/project-import-regression-qa.yml'
  pull_request:
    paths:
      - 'studio/project-import-engine.js'
      - 'studio/project-import-integration.js'
      - 'studio/project-import-regression.test.js'
      - '.github/workflows/project-import-regression-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check studio/project-import-engine.js
          node --check studio/project-import-integration.js
          node --check studio/project-import-regression.test.js
      - name: Run project import regression
        run: node studio/project-import-regression.test.js
