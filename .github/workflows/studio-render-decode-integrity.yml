name: ProfitMente Studio Render Decode Integrity QA

on:
  push:
    paths:
      - 'studio/render_bundle.py'
      - 'studio/verify_render_decode.py'
      - 'studio/test_verify_render_decode.py'
      - '.github/workflows/studio-render-decode-integrity.yml'
  pull_request:
    paths:
      - 'studio/render_bundle.py'
      - 'studio/verify_render_decode.py'
      - 'studio/test_verify_render_decode.py'
      - '.github/workflows/studio-render-decode-integrity.yml'
  workflow_dispatch:

jobs:
  decode-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python syntax
        run: python -m py_compile studio/verify_render_decode.py studio/render_bundle.py studio/test_verify_render_decode.py
      - name: Full decode regression
        working-directory: studio
        run: python test_verify_render_decode.py
