name: ProfitMente Studio Remove Time QA

on:
  push:
    paths:
      - 'studio/remove-time-engine.js'
      - 'studio/remove-time-integration.js'
      - 'studio/test_remove_time.mjs'
      - 'studio/index.html'
      - '.github/workflows/remove-time-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/remove-time-engine.js
          node --check studio/remove-time-integration.js
      - name: Remove time regression
        run: node studio/test_remove_time.mjs
      - name: Verify Studio wiring
        run: |
          grep -q 'remove-time-engine.js' studio/index.html
          grep -q 'remove-time-integration.js' studio/index.html
          grep -q 'removeTimeBtn' studio/remove-time-integration.js
