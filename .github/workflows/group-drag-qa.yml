name: ProfitMente Studio Group Drag QA

on:
  push:
    paths:
      - 'studio/group-drag-engine.js'
      - 'studio/timeline-magnet.js'
      - 'studio/test_group_drag.mjs'
      - '.github/workflows/group-drag-qa.yml'
  pull_request:
    paths:
      - 'studio/group-drag-engine.js'
      - 'studio/timeline-magnet.js'
      - 'studio/test_group_drag.mjs'
      - '.github/workflows/group-drag-qa.yml'
  workflow_dispatch:

jobs:
  group-drag-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/group-drag-engine.js
          node --check studio/timeline-magnet.js
          node --check studio/test_group_drag.mjs
      - name: Group drag regression
        run: node studio/test_group_drag.mjs
      - name: Verify timeline wiring
        run: |
          grep -q "group-drag-engine.js" studio/timeline-magnet.js
          grep -q "ProfitMenteGroupDragEngine" studio/timeline-magnet.js
          grep -q "originals.length>1" studio/timeline-magnet.js