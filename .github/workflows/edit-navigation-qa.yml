name: ProfitMente Studio Edit Navigation QA

on:
  push:
    paths:
      - 'studio/edit-navigation-engine.js'
      - 'studio/edit-navigation-integration.js'
      - 'studio/test_edit_navigation.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/edit-navigation-qa.yml'
  workflow_dispatch:

jobs:
  edit-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/edit-navigation-engine.js
          node --check studio/edit-navigation-integration.js
          node --check studio/feature-bootstrap.js
      - name: Verify strict edit navigation
        run: node studio/test_edit_navigation.mjs
      - name: Verify bootstrap wiring
        run: |
          grep -q "edit-navigation-engine.js" studio/feature-bootstrap.js
          grep -q "edit-navigation-integration.js" studio/feature-bootstrap.js
