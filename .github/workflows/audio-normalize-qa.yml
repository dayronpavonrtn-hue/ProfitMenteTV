name: ProfitMente Studio Audio Normalize QA

on:
  push:
    paths:
      - 'studio/audio-normalize-engine.js'
      - 'studio/audio-normalize-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_audio_normalize_engine.mjs'
      - '.github/workflows/audio-normalize-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/audio-normalize-engine.js
          node --check studio/audio-normalize-integration.js
          node --check studio/generator-integration.js
      - name: Audio normalization regression
        run: node studio/test_audio_normalize_engine.mjs
      - name: Verify Studio integration
        run: |
          grep -q "audio-normalize-engine.js" studio/generator-integration.js
          grep -q "audio-normalize-integration.js" studio/generator-integration.js
          grep -q "audioNormalizeAllBtn" studio/audio-normalize-integration.js
          grep -q "audioNormalization" studio/audio-normalize-integration.js
