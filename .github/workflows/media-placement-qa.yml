name: ProfitMente Studio Media Placement QA

on:
  push:
    paths:
      - 'studio/media-placement-engine.js'
      - 'studio/media-placement-integration.js'
      - 'studio/test_media_placement.mjs'
      - 'studio/timeline-operations.js'
      - '.github/workflows/media-placement-qa.yml'
  workflow_dispatch:

jobs:
  media-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/media-placement-engine.js
          node --check studio/media-placement-integration.js
          node --check studio/timeline-operations.js
          node --check studio/test_media_placement.mjs
      - name: Media placement regression
        working-directory: studio
        run: node test_media_placement.mjs
      - name: Verify bootstrap wiring
        run: node -e "const fs=require('fs');const t=fs.readFileSync('studio/feature-bootstrap.js','utf8');if(!t.includes(\"['media-placement-engine.js','ProfitMenteMediaPlacementEngine']\")||!t.includes(\"['media-placement-integration.js','ProfitMenteMediaPlacement']\"))process.exit(1);console.log('media placement bootstrap wiring OK')"
