name: ProfitMente Studio Group Edit QA

on:
  push:
    paths:
      - 'studio/group-edit-engine.js'
      - 'studio/edit-tools.js'
      - 'studio/test_group_edit.mjs'
      - '.github/workflows/group-edit-qa.yml'
  pull_request:
    paths:
      - 'studio/group-edit-engine.js'
      - 'studio/edit-tools.js'
      - 'studio/test_group_edit.mjs'
      - '.github/workflows/group-edit-qa.yml'
  workflow_dispatch:

jobs:
  grouped-edit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/group-edit-engine.js
          node --check studio/edit-tools.js
          node --check studio/test_group_edit.mjs
      - name: Grouped edit regression
        run: node studio/test_group_edit.mjs
      - name: Verify UI wiring
        run: |
          grep -q "group-edit-engine.js" studio/edit-tools.js
          grep -q "lockedMembers" studio/edit-tools.js
          grep -q "Grupo duplicado" studio/edit-tools.js
          grep -q "Grupo eliminado" studio/edit-tools.js
