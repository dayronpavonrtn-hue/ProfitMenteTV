name: ProfitMente Studio Render Progress QA

on:
  push:
    paths:
      - 'studio/render_progress.py'
      - 'studio/render_bundle.py'
      - 'studio/render_motion_text.py'
      - 'studio/studio_server.py'
      - 'studio/render-job-integration.js'
      - 'studio/bundle-render-job-integration.js'
      - 'studio/render-progress-engine.js'
      - 'studio/render-progress-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_render_progress.py'
      - 'studio/test_render_progress_engine.js'
      - '.github/workflows/render-progress-qa.yml'
  workflow_dispatch:

jobs:
  render-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax
        run: python -m py_compile studio/render_progress.py studio/render_bundle.py studio/render_motion_text.py studio/studio_server.py studio/test_render_progress.py
      - name: Render progress backend regression
        run: python studio/test_render_progress.py
      - name: Frontend syntax
        run: |
          node --check studio/render-job-integration.js
          node --check studio/bundle-render-job-integration.js
          node --check studio/render-progress-engine.js
          node --check studio/render-progress-integration.js
          node --check studio/feature-bootstrap.js
      - name: Render progress frontend regression
        run: node studio/test_render_progress_engine.js
      - name: Progress wiring guard
        run: |
          grep -q 'PROFITMENTE_PROGRESS_FILE' studio/render_progress.py
          grep -q 'render_progress_phases' studio/studio_server.py
          grep -q 's.phase' studio/render-job-integration.js
          grep -q 'profitmente:render-progress' studio/bundle-render-job-integration.js
          grep -q "emitProgress('rendering'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('qa'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('downloading'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('done'" studio/bundle-render-job-integration.js
          grep -q 'render-progress-engine.js' studio/feature-bootstrap.js
          grep -q 'render-progress-integration.js' studio/feature-bootstrap.js
      - name: Zero-cost frontend guard
        run: |
          ! grep -Eiq 'stripe|openai|runway|replicate|elevenlabs|api[_-]?key|billing' studio/render-progress-engine.js studio/render-progress-integration.js
