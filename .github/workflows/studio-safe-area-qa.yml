name: ProfitMente Studio Safe Area QA

on:
  push:
    paths:
      - 'studio/safe-area-engine.js'
      - 'studio/safe-area-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_safe_area_engine.mjs'
      - '.github/workflows/studio-safe-area-qa.yml'
  workflow_dispatch:

jobs:
  safe-area-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/safe-area-engine.js
          node --check studio/safe-area-integration.js
          node --check studio/generator-integration.js
      - name: Safe area regression
        run: node studio/test_safe_area_engine.mjs
      - name: Loader integration check
        run: |
          grep -q "bootSafeArea" studio/generator-integration.js
          grep -q "safe-area-engine.js" studio/generator-integration.js
          grep -q "safe-area-integration.js" studio/generator-integration.js
          grep -q "safeAreaPlatform" studio/safe-area-integration.js
