name: ProfitMente Studio Auto Transition QA

on:
  push:
    paths:
      - 'studio/auto-transition-engine.js'
      - 'studio/auto-transition-integration.js'
      - 'studio/auto-finish-engine.js'
      - 'studio/auto-finish-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_auto_transition_engine.mjs'
      - 'studio/test_auto_finish_engine.mjs'
      - 'studio/test_auto_finish_wiring.mjs'
      - '.github/workflows/auto-transition-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/auto-transition-engine.js
          node --check studio/auto-transition-integration.js
          node --check studio/auto-finish-engine.js
          node --check studio/auto-finish-integration.js
      - name: Auto transition regression
        run: node studio/test_auto_transition_engine.mjs
      - name: Auto Finish regression
        run: node studio/test_auto_finish_engine.mjs
      - name: Verify Studio wiring
        run: node studio/test_auto_finish_wiring.mjs
