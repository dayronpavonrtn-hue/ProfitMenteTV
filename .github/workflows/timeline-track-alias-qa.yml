name: ProfitMente Studio Timeline Track Alias QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/timeline-operations.js'
      - 'studio/timeline-track-alias-guard.js'
      - 'studio/test_timeline_track_alias_guard.mjs'
      - 'studio/index.html'
      - '.github/workflows/timeline-track-alias-qa.yml'
  workflow_dispatch:

jobs:
  timeline-track-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/timeline-operations.js
          node --check studio/timeline-track-alias-guard.js
          node --check studio/test_timeline_track_alias_guard.mjs
      - name: Legacy track alias regression
        run: node studio/test_timeline_track_alias_guard.mjs
      - name: Integration order
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('studio/index.html').read_text(encoding='utf-8')
          ops=html.index('timeline-operations.js')
          guard=html.index('timeline-track-alias-guard.js')
          paste=html.index('timeline-paste-extension.js')
          assert ops < guard < paste, 'track alias guard must load after operations and before extensions'
          print('timeline track alias integration ok')
          PY
