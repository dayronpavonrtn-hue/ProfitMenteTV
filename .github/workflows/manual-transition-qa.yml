name: ProfitMente Studio Manual Transition QA

on:
  push:
    paths:
      - 'studio/manual-transition-engine.js'
      - 'studio/manual-transition-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_manual_transition_engine.mjs'
      - '.github/workflows/manual-transition-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/manual-transition-engine.js
          node --check studio/manual-transition-integration.js
          node --check studio/feature-bootstrap.js
      - name: Manual transition regression
        run: node studio/test_manual_transition_engine.mjs
      - name: Verify Studio wiring
        run: |
          grep -q "manual-transition-engine.js" studio/feature-bootstrap.js
          grep -q "manual-transition-integration.js" studio/feature-bootstrap.js
          grep -q "transitionDuration" studio/preview-engine.js
          grep -q "transition_duration" studio/render_mp4.py
