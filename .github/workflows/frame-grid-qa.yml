name: ProfitMente Studio Frame Grid QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/frame-grid-engine.js'
      - 'studio/frame-grid-integration.js'
      - 'studio/project-frame-rate-engine.js'
      - 'studio/project-frame-rate-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_frame_grid.mjs'
      - '.github/workflows/frame-grid-qa.yml'
  workflow_dispatch:

jobs:
  frame-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/frame-grid-engine.js
          node --check studio/frame-grid-integration.js
          node --check studio/feature-bootstrap.js
      - name: Frame grid regression
        run: node studio/test_frame_grid.mjs
