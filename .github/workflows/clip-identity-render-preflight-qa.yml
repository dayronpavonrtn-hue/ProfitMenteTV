name: ProfitMente Studio Clip Identity Render Preflight QA

on:
  push:
    paths:
      - 'studio/clip_identity_preflight.py'
      - 'studio/test_clip_identity_preflight.py'
      - 'studio/render_bundle.py'
      - '.github/workflows/clip-identity-render-preflight-qa.yml'
  workflow_dispatch:

jobs:
  clip-identity-render-preflight-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check render preflight syntax
        run: python -m py_compile studio/clip_identity_preflight.py studio/test_clip_identity_preflight.py studio/render_bundle.py
      - name: Verify strict canonical clip identities
        working-directory: studio
        run: python test_clip_identity_preflight.py
      - name: Verify renderer invokes identity gate before FFmpeg composition
        shell: python
        run: |
          from pathlib import Path
          text=Path('studio/render_bundle.py').read_text(encoding='utf-8')
          gate="clip_identity_preflight.py"
          compose="render_motion_text.py"
          assert gate in text and compose in text
          assert text.index(gate) < text.index(compose)
          print('Render wiring QA OK')
