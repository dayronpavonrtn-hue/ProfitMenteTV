name: ProfitMente Studio Legacy Track Validation QA

on:
  push:
    branches: [ main ]
    paths:
      - 'studio/validate_project.py'
      - 'studio/track_state_render.py'
      - 'studio/test_validate_legacy_track_state.py'
      - '.github/workflows/legacy-track-validation-qa.yml'
  pull_request:
    paths:
      - 'studio/validate_project.py'
      - 'studio/track_state_render.py'
      - 'studio/test_validate_legacy_track_state.py'
      - '.github/workflows/legacy-track-validation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-track-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check validator syntax
        run: python -m py_compile studio/validate_project.py studio/track_state_render.py studio/test_validate_legacy_track_state.py
      - name: Verify legacy track/state parity
        run: python studio/test_validate_legacy_track_state.py
