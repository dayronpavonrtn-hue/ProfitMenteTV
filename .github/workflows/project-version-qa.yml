name: ProfitMente Studio Project Version QA

on:
  push:
    paths:
      - 'studio/project-version-engine.js'
      - 'studio/project-version-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_project_versions.mjs'
      - 'studio/test_project_version_identity.mjs'
      - '.github/workflows/project-version-qa.yml'
  workflow_dispatch:

jobs:
  project-version-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check version engine
        run: node --check studio/project-version-engine.js
      - name: Syntax check version integration
        run: node --check studio/project-version-integration.js
      - name: Syntax check loader
        run: node --check studio/generator-integration.js
      - name: Run project version regression
        run: node studio/test_project_versions.mjs
      - name: Run project version identity regression
        run: node studio/test_project_version_identity.mjs
      - name: Verify Studio loads version support
        run: grep -q "project-version-engine.js" studio/generator-integration.js
