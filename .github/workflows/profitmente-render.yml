name: ProfitMente Studio MP4 Render

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project JSON path committed in repository
        required: true
        default: studio/example-project.json
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/profitmente-render.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic generator
        run: node studio/test_generator.mjs
      - name: Test undo redo history
        run: node studio/test_history.mjs
      - name: Test timeline ripple editing
        run: node studio/test_timeline_operations.mjs
      - name: Test timeline markers
        run: node studio/test_markers.mjs
      - name: Test self-contained render bundle
        run: node studio/test_bundle.mjs
      - name: Test multi-project library
        run: node studio/test_project_library.mjs
      - name: Test missing media relink
        run: node studio/test_relink.mjs
      - name: Test Studio integration integrity
        run: node studio/test_studio_integrity.mjs
      - name: Test timeline filmstrips
        run: node studio/test_filmstrip.mjs
      - name: Test source trim QA
        run: node studio/test_source_trim_qa.mjs
      - name: Check app.js
        run: node --check studio/app.js
      - name: Check preview-engine.js
        run: node --check studio/preview-engine.js
      - name: Check audio-engine.js
        run: node --check studio/audio-engine.js
      - name: Check bundle-engine.js
        run: node --check studio/bundle-engine.js
      - name: Check caption-preview.js
        run: node --check studio/caption-preview.js
      - name: Check edit-tools.js
        run: node --check studio/edit-tools.js
      - name: Check filmstrip-engine.js
        run: node --check studio/filmstrip-engine.js
      - name: Check generator-engine.js
        run: node --check studio/generator-engine.js
      - name: Check generator-integration.js
        run: node --check studio/generator-integration.js
      - name: Check history-engine.js
        run: node --check studio/history-engine.js
      - name: Check media-inspector.js
        run: node --check studio/media-inspector.js
      - name: Check marker-engine.js
        run: node --check studio/marker-engine.js
      - name: Check marker-integration.js
        run: node --check studio/marker-integration.js
      - name: Check clip-inspector.js
        run: node --check studio/clip-inspector.js
      - name: Check project-library.js
        run: node --check studio/project-library.js
      - name: Check qa-engine.js
        run: node --check studio/qa-engine.js
      - name: Check relink-engine.js
        run: node --check studio/relink-engine.js
      - name: Check timeline-magnet.js
        run: node --check studio/timeline-magnet.js
      - name: Check timeline-operations.js
        run: node --check studio/timeline-operations.js
      - name: Check transport-engine.js
        run: node --check studio/transport-engine.js
      - name: Check track-controls.js
        run: node --check studio/track-controls.js
      - name: Check waveform-engine.js
        run: node --check studio/waveform-engine.js
      - name: Validate Python render tools
        run: |
          python -m py_compile studio/render_mp4.py studio/render_bundle.py studio/validate_project.py studio/studio_server.py studio/smoke_test.py studio/test_server_api.py studio/test_source_offset.py studio/test_speed.py studio/test_visual_transform.py studio/test_fit_flip.py
      - name: Test local render API security
        run: python studio/test_server_api.py
      - name: Test local Studio server readiness
        run: |
          python studio/studio_server.py --port 8099 > "$RUNNER_TEMP/studio-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8099/api/health > "$RUNNER_TEMP/studio-health.json"; then
              break
            fi
            sleep 0.25
          done
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'studio-health.json'
          data=json.loads(p.read_text())
          assert data['ok'] is True
          assert 'ffmpeg' in data and 'ffprobe' in data and 'render_ready' in data
          assert data['render_ready'] == bool(data['ffmpeg'] and data['ffprobe'])
          print('Studio local server ready:', data)
          PY
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Test real clip source trimming
        run: python studio/test_source_offset.py
      - name: Test clip playback speed
        run: python studio/test_speed.py
      - name: Test visual clip transforms
        run: python studio/test_visual_transform.py
      - name: Test clip fit and flip render
        run: python studio/test_fit_flip.py
      - name: End-to-end Studio smoke test
        run: python studio/smoke_test.py "$RUNNER_TEMP/profitmente-smoke"
      - name: Upload smoke-test MP4
        uses: actions/upload-artifact@v4
        with:
          name: profitmente-studio-smoke-test
          path: ${{ runner.temp }}/profitmente-smoke/profitmente-smoke.mp4
          if-no-files-found: error

  render:
    if: github.event_name == 'workflow_dispatch'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Validate project
        run: python studio/validate_project.py "${{ inputs.project }}" studio/assets
      - name: Render MP4
        run: |
          mkdir -p output
          python studio/render_mp4.py "${{ inputs.project }}" studio/assets output/profitmente-studio.mp4
      - name: Validate output
        run: |
          test -s output/profitmente-studio.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/profitmente-studio.mp4
          ffprobe -v error -show_entries format=duration,size -of json output/profitmente-studio.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: profitmente-studio-mp4
          path: output/profitmente-studio.mp4
          if-no-files-found: error
