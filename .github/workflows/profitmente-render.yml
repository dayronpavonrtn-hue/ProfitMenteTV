name: ProfitMente Studio MP4 Render

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project JSON path committed in repository
        required: true
        default: studio/example-project.json
  push:
    paths:
      - 'studio/generator-engine.js'
      - 'studio/generator-integration.js'
      - 'studio/test_generator.mjs'
      - 'studio/history-engine.js'
      - 'studio/test_history.mjs'
      - 'studio/bundle-engine.js'
      - 'studio/test_bundle.mjs'
      - 'studio/timeline-magnet.js'
      - 'studio/media-inspector.js'
      - 'studio/clip-inspector.js'
      - 'studio/project-library.js'
      - 'studio/test_project_library.mjs'
      - 'studio/qa-engine.js'
      - 'studio/style.css'
      - 'studio/render_bundle.py'
      - 'studio/index.html'
      - 'studio/render_mp4.py'
      - 'studio/validate_project.py'
      - 'studio/smoke_test.py'
      - '.github/workflows/profitmente-render.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic generator
        run: node studio/test_generator.mjs
      - name: Test undo redo history
        run: node studio/test_history.mjs
      - name: Test self-contained render bundle
        run: node studio/test_bundle.mjs
      - name: Test multi-project library
        run: node studio/test_project_library.mjs
      - name: Validate timeline enhancement JavaScript
        run: node --check studio/timeline-magnet.js
      - name: Validate editor enhancement JavaScript
        run: |
          node --check studio/media-inspector.js
          node --check studio/clip-inspector.js
          node --check studio/project-library.js
          node --check studio/qa-engine.js
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: End-to-end Studio smoke test
        run: python studio/smoke_test.py "$RUNNER_TEMP/profitmente-smoke"
      - name: Upload smoke-test MP4
        uses: actions/upload-artifact@v4
        with:
          name: profitmente-studio-smoke-test
          path: ${{ runner.temp }}/profitmente-smoke/profitmente-smoke.mp4
          if-no-files-found: error

  render:
    if: github.event_name == 'workflow_dispatch'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Validate project
        run: python studio/validate_project.py "${{ inputs.project }}" studio/assets
      - name: Render MP4
        run: |
          mkdir -p output
          python studio/render_mp4.py "${{ inputs.project }}" studio/assets output/profitmente-studio.mp4
      - name: Validate output
        run: |
          test -s output/profitmente-studio.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/profitmente-studio.mp4
          ffprobe -v error -show_entries format=duration,size -of json output/profitmente-studio.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: profitmente-studio-mp4
          path: output/profitmente-studio.mp4
          if-no-files-found: error
