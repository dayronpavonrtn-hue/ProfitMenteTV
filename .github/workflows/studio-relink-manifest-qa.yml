name: ProfitMente Studio Relink Manifest QA

on:
  push:
    paths:
      - 'studio/relink-engine.js'
      - 'studio/relink-manifest-regression.js'
      - '.github/workflows/studio-relink-manifest-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relink-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/relink-engine.js && node --check studio/relink-manifest-regression.js
      - name: Relink manifest regression
        run: node studio/relink-manifest-regression.js
