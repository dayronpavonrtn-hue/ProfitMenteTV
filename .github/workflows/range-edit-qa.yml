name: ProfitMente Studio Range Edit QA

on:
  push:
    paths:
      - 'studio/range-edit-engine.js'
      - 'studio/range-edit-integration.js'
      - 'studio/test_range_edit.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/range-edit-qa.yml'
  workflow_dispatch:

jobs:
  range-edit-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/range-edit-engine.js
          node --check studio/range-edit-integration.js
          node --check studio/feature-bootstrap.js
      - name: Range edit regression
        run: node studio/test_range_edit.mjs
      - name: Verify Studio integration
        run: |
          grep -q "range-edit-engine.js" studio/feature-bootstrap.js
          grep -q "range-edit-integration.js" studio/feature-bootstrap.js
          grep -q "ProfitMenteRangeEdit" studio/range-edit-integration.js
