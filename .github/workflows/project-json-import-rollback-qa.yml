name: Project JSON import rollback QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/project-import-integration.js'
      - 'studio/project-import-engine.js'
      - 'studio/tests/project-json-import-rollback-regression.js'
      - '.github/workflows/project-json-import-rollback-qa.yml'
  pull_request:
    paths:
      - 'studio/project-import-integration.js'
      - 'studio/project-import-engine.js'
      - 'studio/tests/project-json-import-rollback-regression.js'
      - '.github/workflows/project-json-import-rollback-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-import-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transactional JSON import rollback
        run: node studio/tests/project-json-import-rollback-regression.js
