name: ProfitMente Studio Advanced Edit Lock QA

on:
  push:
    paths:
      - 'studio/edit-lock-guard.js'
      - 'studio/slip-edit-integration.js'
      - 'studio/roll-edit-integration.js'
      - 'studio/rate-stretch-integration.js'
      - 'studio/freeze-frame-integration.js'
      - 'studio/frame-nudge-engine.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_advanced_edit_lock_guard.mjs'
      - '.github/workflows/studio-advanced-edit-lock-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advanced-edit-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/edit-lock-guard.js
          node --check studio/slip-edit-integration.js
          node --check studio/roll-edit-integration.js
          node --check studio/rate-stretch-integration.js
          node --check studio/freeze-frame-integration.js
          node --check studio/frame-nudge-engine.js
          node --check studio/feature-bootstrap.js
      - name: Advanced edit lock regression
        run: node studio/test_advanced_edit_lock_guard.mjs
