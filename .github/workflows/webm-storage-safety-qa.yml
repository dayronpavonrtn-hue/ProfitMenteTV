name: ProfitMente Studio WebM Storage Safety QA

on:
  push:
    paths:
      - 'studio/webm-render-engine.js'
      - 'studio/webm-render-integration.js'
      - 'studio/tests/webm-storage-safety-regression.js'
      - '.github/workflows/webm-storage-safety-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/webm-render-engine.js
          node --check studio/webm-render-integration.js
          node --check studio/tests/webm-storage-safety-regression.js
      - name: WebM storage safety regression
        run: node studio/tests/webm-storage-safety-regression.js
