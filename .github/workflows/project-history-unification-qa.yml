name: ProfitMente Studio Project History Unification QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/project-history-engine.js'
      - 'studio/project-history-integration.js'
      - 'studio/test_project_history_unification.mjs'
      - '.github/workflows/project-history-unification-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-history-unification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/project-history-engine.js
          node --check studio/project-history-integration.js
          node --check studio/test_project_history_unification.mjs
      - name: Project history regression
        run: node studio/test_project_history_unification.mjs
      - name: Zero-cost boundary
        run: |
          ! grep -Eri "(stripe|openai\.com|anthropic|runway|replicate|elevenlabs|api[_-]?key|billing)" studio/project-history-engine.js studio/project-history-integration.js studio/test_project_history_unification.mjs
