name: ProfitMente Studio Project Import Legacy ID QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/project-import-engine.js'
      - 'studio/test_project_import_legacy_numeric_ids.mjs'
      - '.github/workflows/project-import-legacy-id-qa.yml'
  pull_request:
    paths:
      - 'studio/project-import-engine.js'
      - 'studio/test_project_import_legacy_numeric_ids.mjs'
      - '.github/workflows/project-import-legacy-id-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-clip-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check project import engine
        run: node --check studio/project-import-engine.js
      - name: Legacy numeric clip identity regression
        run: node studio/test_project_import_legacy_numeric_ids.mjs
