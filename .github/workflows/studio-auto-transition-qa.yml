name: ProfitMente Studio Auto Transition QA

on:
  push:
    paths:
      - 'studio/auto-transition-engine.js'
      - 'studio/auto-transition-integration.js'
      - 'studio/test_auto_transition_engine.mjs'
      - '.github/workflows/studio-auto-transition-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check automatic transition engine syntax
        run: node --check studio/auto-transition-engine.js
      - name: Check automatic transition integration syntax
        run: node --check studio/auto-transition-integration.js
      - name: Test automatic transition lock safety
        run: node studio/test_auto_transition_engine.mjs
