name: ProfitMente Studio Bundle Import Safety QA

on:
  push:
    paths:
      - 'studio/bundle-import-engine.js'
      - 'studio/bundle-import-integration.js'
      - 'studio/test_bundle_import_engine.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/bundle-import-safety-qa.yml'
  pull_request:
    paths:
      - 'studio/bundle-import-engine.js'
      - 'studio/bundle-import-integration.js'
      - 'studio/test_bundle_import_engine.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/bundle-import-safety-qa.yml'
  workflow_dispatch:

jobs:
  bundle-import-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/bundle-import-engine.js
          node --check studio/bundle-import-integration.js
          node --check studio/feature-bootstrap.js
      - name: Bundle import safety regression
        run: node studio/test_bundle_import_engine.mjs
      - name: Feature bootstrap regression
        run: node studio/test_feature_bootstrap.mjs
      - name: Verify safe importer wiring
        run: |
          grep -q "bundle-import-engine.js" studio/feature-bootstrap.js
          grep -q "bundle-import-integration.js" studio/feature-bootstrap.js
