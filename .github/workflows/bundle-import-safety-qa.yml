name: ProfitMente Studio Bundle Import Safety QA

on:
  push:
    paths:
      - 'studio/bundle-import-engine.js'
      - 'studio/bundle-import-integration.js'
      - 'studio/project-import-integration.js'
      - 'studio/test_bundle_import_engine.mjs'
      - 'studio/test_bundle_import_library_preservation.js'
      - 'studio/tests/bundle-import-presave-regression.js'
      - 'studio/tests/bundle-import-media-reference-regression.js'
      - 'studio/tests/bundle-import-partial-write-rollback-regression.js'
      - 'studio/tests/bundle-import-rejected-media-write-rollback-regression.js'
      - 'studio/tests/bundle-import-persistence-verification-regression.js'
      - 'studio/tests/project-import-autosave-failure-regression.js'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/bundle-import-safety-qa.yml'
  pull_request:
    paths:
      - 'studio/bundle-import-engine.js'
      - 'studio/bundle-import-integration.js'
      - 'studio/project-import-integration.js'
      - 'studio/test_bundle_import_engine.mjs'
      - 'studio/test_bundle_import_library_preservation.js'
      - 'studio/tests/bundle-import-presave-regression.js'
      - 'studio/tests/bundle-import-media-reference-regression.js'
      - 'studio/tests/bundle-import-partial-write-rollback-regression.js'
      - 'studio/tests/bundle-import-rejected-media-write-rollback-regression.js'
      - 'studio/tests/bundle-import-persistence-verification-regression.js'
      - 'studio/tests/project-import-autosave-failure-regression.js'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/bundle-import-safety-qa.yml'
  workflow_dispatch:

jobs:
  bundle-import-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/bundle-import-engine.js
          node --check studio/bundle-import-integration.js
          node --check studio/project-import-integration.js
          node --check studio/test_bundle_import_library_preservation.js
          node --check studio/tests/bundle-import-presave-regression.js
          node --check studio/tests/bundle-import-media-reference-regression.js
          node --check studio/tests/bundle-import-partial-write-rollback-regression.js
          node --check studio/tests/bundle-import-rejected-media-write-rollback-regression.js
          node --check studio/tests/bundle-import-persistence-verification-regression.js
          node --check studio/tests/project-import-autosave-failure-regression.js
          node --check studio/feature-bootstrap.js
      - name: Bundle import safety regression
        run: node studio/test_bundle_import_engine.mjs
      - name: Bundle import active-project preservation regression
        run: node studio/tests/bundle-import-presave-regression.js
      - name: Bundle import media-reference integrity regression
        run: node studio/tests/bundle-import-media-reference-regression.js
      - name: Bundle import media-library preservation regression
        run: node studio/test_bundle_import_library_preservation.js
      - name: Bundle import partial-write rollback regression
        run: node studio/tests/bundle-import-partial-write-rollback-regression.js
      - name: Bundle import rejected-media-write rollback regression
        run: node studio/tests/bundle-import-rejected-media-write-rollback-regression.js
      - name: Bundle import persistence verification regression
        run: node studio/tests/bundle-import-persistence-verification-regression.js
      - name: Import autosave failure regression
        run: node studio/tests/project-import-autosave-failure-regression.js
      - name: Feature bootstrap regression
        run: node studio/test_feature_bootstrap.mjs
      - name: Verify safe importer wiring
        run: |
          grep -q "bundle-import-engine.js" studio/feature-bootstrap.js
          grep -q "bundle-import-integration.js" studio/feature-bootstrap.js
