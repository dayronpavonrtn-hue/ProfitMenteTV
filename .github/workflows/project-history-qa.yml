name: ProfitMente Studio Project History QA

on:
  push:
    paths:
      - 'studio/project-history-engine.js'
      - 'studio/project-history-integration.js'
      - 'studio/project-library.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_project_history_engine.mjs'
      - '.github/workflows/project-history-qa.yml'
  pull_request:
    paths:
      - 'studio/project-history-engine.js'
      - 'studio/project-history-integration.js'
      - 'studio/project-library.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_project_history_engine.mjs'
  workflow_dispatch:

jobs:
  project-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/project-history-engine.js
          node --check studio/project-history-integration.js
          node --check studio/project-library.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_project_history_engine.mjs
      - name: Project history regression
        run: node studio/test_project_history_engine.mjs
      - name: Verify unified Studio integration
        run: |
          grep -q "project-history-engine.js" studio/feature-bootstrap.js
          grep -q "project-history-integration.js" studio/feature-bootstrap.js
          grep -q "#undoBtn" studio/project-history-integration.js
          grep -q "#redoBtn" studio/project-history-integration.js
          grep -q "stopImmediatePropagation" studio/project-history-integration.js
          grep -q "},true);" studio/project-history-integration.js
          grep -q "ProfitMenteProjectHistory?.reset" studio/project-library.js
          grep -q "window.persist=function" studio/project-history-integration.js
