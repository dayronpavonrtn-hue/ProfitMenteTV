name: ProfitMente Studio Feature Bootstrap Wiring QA

on:
  push:
    paths:
      - 'studio/index.html'
      - 'studio/transition-duration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_feature_bootstrap_wiring.mjs'
      - '.github/workflows/feature-bootstrap-wiring-qa.yml'
  workflow_dispatch:

jobs:
  feature-bootstrap-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check startup chain
        run: |
          node --check studio/transition-duration.js
          node --check studio/feature-bootstrap.js
      - name: Verify advanced feature wiring
        run: node studio/test_feature_bootstrap_wiring.mjs
