name: ProfitMente Studio Project Import QA
on:
  push:
    paths:
      - 'studio/project-library.js'
      - 'studio/project-import-engine.js'
      - 'studio/project-import-integration.js'
      - 'studio/project-migration-engine.js'
      - 'studio/project-migration-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/transition-duration.js'
      - 'studio/index.html'
      - 'studio/generator-integration.js'
      - 'studio/test_project_import.mjs'
      - 'studio/test_project_import_runtime_wiring.mjs'
      - 'studio/test_project_import_migration.mjs'
      - 'studio/test_project_library_import_migration.mjs'
      - 'studio/test_feature_bootstrap_wiring.mjs'
      - '.github/workflows/project-import-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check studio/project-library.js
          node --check studio/project-import-engine.js
          node --check studio/project-import-integration.js
          node --check studio/project-migration-engine.js
          node --check studio/project-migration-integration.js
          node --check studio/feature-bootstrap.js
          node --check studio/generator-integration.js
      - name: Test safe import
        run: node studio/test_project_import.mjs
      - name: Test primary import runtime wiring
        run: node studio/test_project_import_runtime_wiring.mjs
      - name: Test import migration parity
        run: node studio/test_project_import_migration.mjs
      - name: Test project library import migration
        run: node studio/test_project_library_import_migration.mjs
      - name: Test import bootstrap wiring
        run: node studio/test_feature_bootstrap_wiring.mjs
