name: ProfitMente Studio Project Import QA
on:
  push:
    paths:
      - 'studio/project-import-engine.js'
      - 'studio/project-import-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_project_import.mjs'
      - '.github/workflows/project-import-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check studio/project-import-engine.js
          node --check studio/project-import-integration.js
          node --check studio/generator-integration.js
      - name: Test safe import
        run: node studio/test_project_import.mjs
