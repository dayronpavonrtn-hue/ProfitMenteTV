name: ProfitMente Studio Render Range QA

on:
  push:
    paths:
      - 'studio/render-range-engine.js'
      - 'studio/render-range-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_render_range_engine.mjs'
      - '.github/workflows/render-range-qa.yml'
  workflow_dispatch:

jobs:
  render-range-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check render range engine
        run: node --check studio/render-range-engine.js
      - name: Syntax check render range integration
        run: node --check studio/render-range-integration.js
      - name: Syntax check Studio loader
        run: node --check studio/generator-integration.js
      - name: Test range extraction and source offsets
        run: node studio/test_render_range_engine.mjs
      - name: Verify range engine is loaded
        run: grep -q "render-range-engine.js" studio/generator-integration.js
      - name: Verify range integration is loaded
        run: grep -q "render-range-integration.js" studio/generator-integration.js
      - name: Verify MP4 range uses local renderer
        run: grep -q "bundler.renderLocal(derived,assets,status)" studio/render-range-integration.js
