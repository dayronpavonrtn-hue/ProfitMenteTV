name: ProfitMente Studio Media Replace Strict QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/media-replace-engine.js'
      - 'studio/test_media_replace_strict.js'
      - '.github/workflows/studio-media-replace-strict-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-replace-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check engine syntax
        run: node --check studio/media-replace-engine.js
      - name: Check regression syntax
        run: node --check studio/test_media_replace_strict.js
      - name: Run strict media replacement regression
        run: node studio/test_media_replace_strict.js
