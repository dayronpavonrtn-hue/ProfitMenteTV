name: ProfitMente Studio Legacy Track State Render QA

on:
  push:
    paths:
      - 'studio/track_state_render.py'
      - 'studio/test_track_state_legacy_normalize.py'
      - 'studio/render_bundle.py'
      - 'studio/render_motion_text.py'
      - 'studio/test_render_motion_text_legacy_state.py'
      - 'studio/render_mp4.py'
      - 'studio/test_render_mp4_legacy_state.py'
      - '.github/workflows/legacy-track-state-render-qa.yml'
  workflow_dispatch:

jobs:
  legacy-track-state-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m py_compile studio/track_state_render.py studio/test_track_state_legacy_normalize.py studio/render_bundle.py studio/render_motion_text.py studio/test_render_motion_text_legacy_state.py studio/render_mp4.py studio/test_render_mp4_legacy_state.py
      - name: Test legacy track-state normalization
        working-directory: studio
        run: python test_track_state_legacy_normalize.py
      - name: Test direct Motion render parity
        working-directory: studio
        run: python test_render_motion_text_legacy_state.py
      - name: Test direct MP4 track-state parity
        working-directory: studio
        run: python test_render_mp4_legacy_state.py
