name: ProfitMente Studio Timeline Insert Gap QA

on:
  push:
    paths:
      - 'studio/timeline-operations.js'
      - 'studio/test_timeline_insert_gap.mjs'
      - '.github/workflows/timeline-insert-gap-qa.yml'
  workflow_dispatch:

jobs:
  timeline-insert-gap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/timeline-operations.js
      - name: Timeline insert gap regression
        run: node studio/test_timeline_insert_gap.mjs
