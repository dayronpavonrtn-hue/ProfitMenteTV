name: ProfitMente Studio Preview Format QA

on:
  push:
    paths:
      - 'studio/preview-format-engine.js'
      - 'studio/preview-format-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/app.js'
      - 'studio/test_preview_format_engine.mjs'
      - '.github/workflows/preview-format-qa.yml'
  workflow_dispatch:

jobs:
  preview-format-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/preview-format-engine.js
          node --check studio/preview-format-integration.js
          node --check studio/feature-bootstrap.js
      - name: Preview format regression
        run: node studio/test_preview_format_engine.mjs
      - name: Verify Studio integration
        run: |
          grep -q "preview-format-engine.js" studio/feature-bootstrap.js
          grep -q "preview-format-integration.js" studio/feature-bootstrap.js
          grep -q "canvas.captureStream(30)" studio/app.js
          grep -q "profitmente-preview-quality" studio/preview-format-integration.js
