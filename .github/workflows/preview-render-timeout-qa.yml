name: ProfitMente Studio Preview Stall Recovery QA

on:
  push:
    paths:
      - 'studio/preview-render-coordinator.js'
      - 'studio/test_preview_render_timeout.mjs'
      - '.github/workflows/preview-render-timeout-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/preview-render-coordinator.js
          node --check studio/test_preview_render_timeout.mjs
      - name: Preview stall recovery regression
        run: node studio/test_preview_render_timeout.mjs
