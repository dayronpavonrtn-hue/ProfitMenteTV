name: ProfitMente Studio Auto Finish QA

on:
  push:
    paths:
      - 'studio/auto-finish-engine.js'
      - 'studio/auto-finish-integration.js'
      - 'studio/export-preflight.js'
      - 'studio/beat-detect-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_auto_finish_engine.mjs'
      - 'studio/test_auto_finish_wiring.mjs'
      - 'studio/test_auto_finish_atomicity.mjs'
      - '.github/workflows/auto-finish-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/auto-finish-engine.js
          node --check studio/auto-finish-integration.js
          node --check studio/export-preflight.js
          node --check studio/beat-detect-integration.js
          node --check studio/feature-bootstrap.js
      - name: Auto Finish regression
        run: node studio/test_auto_finish_engine.mjs
      - name: Verify Studio wiring
        run: node studio/test_auto_finish_wiring.mjs
      - name: Verify atomic rollback
        run: node studio/test_auto_finish_atomicity.mjs
