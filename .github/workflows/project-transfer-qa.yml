name: ProfitMente Studio Project Transfer QA

on:
  push:
    paths:
      - 'studio/project-library.js'
      - 'studio/project-transfer-regression.test.js'
      - '.github/workflows/project-transfer-qa.yml'
  pull_request:
    paths:
      - 'studio/project-library.js'
      - 'studio/project-transfer-regression.test.js'
      - '.github/workflows/project-transfer-qa.yml'
  workflow_dispatch:

jobs:
  project-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check studio/project-library.js && node --check studio/project-transfer-regression.test.js
      - name: Project transfer regression
        run: node studio/project-transfer-regression.test.js
