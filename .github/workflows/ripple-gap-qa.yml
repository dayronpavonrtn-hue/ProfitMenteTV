name: ProfitMente Studio Ripple Gap QA
on:
  push:
    paths:
      - 'studio/ripple-gap-engine.js'
      - 'studio/ripple-gap-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_ripple_gap.mjs'
      - '.github/workflows/ripple-gap-qa.yml'
  workflow_dispatch:
jobs:
  ripple-gap-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/ripple-gap-engine.js
          node --check studio/ripple-gap-integration.js
          node --check studio/feature-bootstrap.js
      - name: Ripple gap regression
        run: node studio/test_ripple_gap.mjs
      - name: Verify Studio wiring
        run: |
          grep -q "ripple-gap-engine.js" studio/feature-bootstrap.js
          grep -q "ripple-gap-integration.js" studio/feature-bootstrap.js
      - name: Verify zero-cost boundary
        run: |
          ! grep -Eqi "stripe|runway|openai|anthropic|replicate|fal\.ai|elevenlabs" studio/ripple-gap-engine.js studio/ripple-gap-integration.js
