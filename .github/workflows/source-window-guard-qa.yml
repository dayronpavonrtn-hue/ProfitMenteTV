name: ProfitMente Studio Source Window Guard QA

on:
  push:
    paths:
      - 'studio/source-window-guard.js'
      - 'studio/validate_project.py'
      - 'studio/generator-integration.js'
      - 'studio/test_source_window_guard.mjs'
      - 'studio/test_source_window_render_validation.py'
      - '.github/workflows/source-window-guard-qa.yml'
  workflow_dispatch:

jobs:
  source-window-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check studio/source-window-guard.js
          node --check studio/generator-integration.js
      - name: Check Python syntax
        run: python -m py_compile studio/validate_project.py studio/test_source_window_render_validation.py
      - name: Run browser source window regression
        run: node studio/test_source_window_guard.mjs
      - name: Run MP4 source window regression
        run: python studio/test_source_window_render_validation.py
      - name: Verify Studio loads source guard after safe autofix
        run: |
          grep -q "qa-autofix.js.*source-window-guard.js" studio/generator-integration.js
          grep -q "sourceWindowGuard" studio/generator-integration.js
