name: ProfitMente Studio Bundle Media Identity QA

on:
  push:
    paths:
      - 'studio/bundle-engine.js'
      - 'studio/media-import-engine.js'
      - 'studio/test_bundle_media_identity.mjs'
      - '.github/workflows/bundle-media-identity-qa.yml'
  workflow_dispatch:

jobs:
  bundle-media-identity-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check bundle engine
        run: node --check studio/bundle-engine.js
      - name: Syntax check media import engine
        run: node --check studio/media-import-engine.js
      - name: Test media identity survives bundle roundtrip
        run: node studio/test_bundle_media_identity.mjs
