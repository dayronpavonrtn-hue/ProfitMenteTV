name: ProfitMente Studio Source Window Guard QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/qa-engine.js'
      - 'studio/qa-source-window-guard.js'
      - 'studio/test_qa_source_window_guard.mjs'
      - '.github/workflows/studio-source-window-guard-qa.yml'
  workflow_dispatch:

jobs:
  source-window-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check studio/qa-source-window-guard.js
          node --check studio/test_qa_source_window_guard.mjs

      - name: Source window identity regressions
        run: node studio/test_qa_source_window_guard.mjs

      - name: Verify zero-cost boundary
        run: '! grep -Eiq "stripe|openai|anthropic|runway|replicate|fal\\.ai|elevenlabs|api[_-]?key|billing" studio/qa-source-window-guard.js studio/test_qa_source_window_guard.mjs'
