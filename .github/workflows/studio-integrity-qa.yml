name: ProfitMente Studio Integrity QA

on:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-integrity-qa.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-integrity-qa.yml'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Critical JavaScript syntax
        run: |
          node --check studio/app.js
          node --check studio/project-library.js
          node --check studio/project-import-engine.js
          node --check studio/project-portability.js
          node --check studio/preview-engine.js
          node --check studio/caption-preview.js
          node --check studio/render-job-client.js
          node --check studio/render-job-integration.js
          node --check studio/bundle-import-integration.js
          node --check studio/media-storage-resilience.js
          node --check studio/media-metadata-engine.js
          node --check studio/media-relink-engine.js
          node --check studio/relink-engine.js
          node --check studio/media-library-cross-project-guard.js
          node --check studio/audio-qc-engine.js
          node --check studio/audio-qc-integration.js
          node --check studio/qa-engine.js
          node --check studio/qa-numeric-scalar-guard.js
          node --check studio/recovery-integration.js
          node --check studio/export-preflight.js
          node --check studio/timeline-word-timing-sync.js
          node --check studio/timeline-left-trim.js
          node --check studio/timeline-right-trim.js
          node --check studio/ripple-gap-engine.js
          node --check studio/ripple-gap-integration.js
          node --check studio/visual-keyframe-engine.js
          node --check studio/visual-keyframe-render-baker.js
          node --check studio/generator-manual-tools.js
      - name: Studio wiring and media integrity
        run: node studio/test_studio_integrity.mjs
      - name: Local media metadata regression
        run: node studio/test_media_metadata_engine.js
      - name: Strict media relink identity regression
        run: node studio/test_media_relink.mjs
      - name: Folder relink ambiguity regression
        run: node studio/relink-ambiguity-regression.js
      - name: Strict preview media identity regression
        run: node studio/test_preview_media_identity.mjs
      - name: Caption preview timing regression
        run: node studio/test_caption_preview_timing.mjs
      - name: Cross-project media identity regression
        run: node studio/test_media_library_cross_project_identity.mjs
      - name: Project export media metadata regression
        run: node studio/test_project_export_metadata.mjs
      - name: Timeline word timing sync regression
        run: node studio/test_timeline_word_timing_sync.js
      - name: Timeline trim word timing regression
        run: node studio/test_timeline_trim_word_timings.mjs
      - name: Visual keyframe MP4 compatibility regression
        run: node studio/test_visual_keyframe_render_baker.js
      - name: Generator auxiliary coverage regression
        run: node studio/test_generator_aux_coverage.js
      - name: QA strict identity regression
        run: node studio/test_qa_identity_strictness.js
      - name: QA strict numeric scalar regression
        run: node studio/test_qa_numeric_scalar_guard.js
      - name: Export preflight numeric identity regression
        run: node studio/test_export_preflight_identity.mjs
      - name: Audio overlap mix QA regression
        run: node studio/test_audio_qc_mix_overlap.js
      - name: Project transfer regression
        run: |
          node studio/project-transfer-regression.test.js
          node studio/test_project_import_bounds.mjs
      - name: Recovery restore integrity regression
        run: node studio/test_recovery_restore_persistence.mjs
      - name: Atomic bundle restore regression
        run: |
          node studio/test_bundle_import_engine.mjs
          node studio/test_media_storage_resilience.mjs
      - name: Critical Python syntax
        run: python -m py_compile studio/render_mp4.py studio/render_motion_text.py studio/caption_render_timing.py studio/studio_server.py studio/output_qc.py studio/validate_project.py studio/media_identity.py studio/test_strict_render_media_identity.py studio/test_caption_render_timing.py
      - name: Strict render media identity regression
        working-directory: studio
        run: python test_strict_render_media_identity.py
      - name: Caption render timing regression
        working-directory: studio
        run: python test_caption_render_timing.py
      - name: Render numeric validation regression
        run: python studio/test_validate_project_numeric.py
      - name: Post-render output QC regression
        working-directory: studio
        run: python test_output_qc.py
