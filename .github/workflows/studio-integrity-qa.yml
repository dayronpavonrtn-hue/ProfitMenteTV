name: ProfitMente Studio Integrity QA

on:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-integrity-qa.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-integrity-qa.yml'
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Critical JavaScript syntax
        run: |
          node --check studio/app.js
          node --check studio/project-library.js
          node --check studio/preview-engine.js
          node --check studio/render-job-client.js
          node --check studio/render-job-integration.js
          node --check studio/qa-engine.js
      - name: Studio wiring and media integrity
        run: node studio/test_studio_integrity.mjs
      - name: Project transfer regression
        run: node studio/project-transfer-regression.test.js
      - name: Critical Python syntax
        run: python -m py_compile studio/render_mp4.py studio/studio_server.py studio/output_qc.py studio/validate_project.py
      - name: Post-render output QC regression
        working-directory: studio
        run: python test_output_qc.py
