name: ProfitMente Studio Offline Media QA
on:
  push:
    branches: [main]
    paths:
      - 'studio/offline-media-engine.js'
      - 'studio/offline-media-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_offline_media.mjs'
      - 'studio/test_offline_media_integration.mjs'
      - '.github/workflows/offline-media-qa.yml'
  workflow_dispatch:
jobs:
  offline-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/offline-media-engine.js
          node --check studio/offline-media-integration.js
          node --check studio/feature-bootstrap.js
      - name: Offline media regression
        run: |
          node studio/test_offline_media.mjs
          node studio/test_offline_media_integration.mjs
      - name: Bootstrap wiring
        run: |
          grep -q "offline-media-engine.js','ProfitMenteOfflineMediaEngine" studio/feature-bootstrap.js
          grep -q "offline-media-integration.js','ProfitMenteOfflineMedia" studio/feature-bootstrap.js
