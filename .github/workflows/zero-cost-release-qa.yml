name: ProfitMente Studio Zero Cost Release QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'broll.py'
      - 'preflight.py'
      - '.github/workflows/zero-cost-release-qa.yml'
  workflow_dispatch:

jobs:
  zero-cost-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify zero-cost offline B-roll fallback
        run: python studio/tests/test_zero_cost_broll.py

      - name: Verify clip inspector lock and identity safety
        run: node studio/test_clip_lock_track_inspector.mjs

      - name: Verify safe QA report rendering
        run: node studio/test_qa_report_safe_render.mjs

      - name: Verify safe timeline rendering
        run: node studio/test_timeline_safe_render.mjs

      - name: Verify imported project frame-rate normalization
        run: node studio/test_project_import_fps.mjs

      - name: Verify strict imported project numeric identities
        run: node studio/test_project_import_numeric_identity.mjs

      - name: Verify strict local MP4 project numeric validation
        run: python studio/test_validate_project_strict_numeric.py

      - name: Verify resilient preview transport state
        run: node studio/test_transport_engine.mjs

      - name: Verify professional JKL shuttle transport
        run: node studio/test_shuttle_transport_engine.mjs

      - name: Verify precise preview frame-step navigation
        run: node studio/test_preview_frame_step.mjs

      - name: Verify strict previous and next timeline edit navigation
        run: node studio/test_edit_navigation.mjs

      - name: Verify browser media proxy lifecycle and original preservation
        run: node studio/test_media_proxy_engine.mjs

      - name: Verify real FFmpeg media proxy generation
        run: python studio/test_media_proxy_server.py

      - name: Verify timeline magnetic snapping and canonical clip identity
        run: node studio/test_timeline_snap.mjs

      - name: Verify strict persistent timeline markers
        run: node studio/test_markers.mjs

      - name: Verify draggable frame-aligned marker engine and zero-cost wiring
        run: |
          node --check studio/marker-engine.js
          node --check studio/marker-integration.js
          node --check studio/test-marker-engine.js
          node studio/test-marker-engine.js
          grep -q 'snapTime' studio/marker-engine.js
          grep -q 'onpointermove' studio/marker-engine.js
          grep -q 'marker-engine.js' studio/feature-bootstrap.js
          grep -q 'marker-integration.js' studio/feature-bootstrap.js
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|api[_-]?key|billing' studio/marker-engine.js studio/marker-integration.js

      - name: Verify synchronized insert-time metadata and caption timing
        run: node studio/test_timeline_time_sync.mjs

      - name: Verify atomic ripple trim and caption synchronization
        run: node studio/test_ripple_trim.mjs

      - name: Verify safe ripple gap compaction and Studio wiring
        run: |
          node --check studio/ripple-gap-engine.js
          node --check studio/ripple-gap-integration.js
          node --check studio/feature-bootstrap.js
          node studio/test_ripple_gap.mjs
          grep -q "ripple-gap-engine.js" studio/feature-bootstrap.js
          grep -q "ripple-gap-integration.js" studio/feature-bootstrap.js
          ! grep -Eqi "stripe|runway|openai|anthropic|replicate|fal\.ai|elevenlabs" studio/ripple-gap-engine.js studio/ripple-gap-integration.js

      - name: Verify atomic Slide Edit source-window and lock safety
        run: node studio/test_slide_edit.mjs

      - name: Verify atomic Razor All multi-track cuts and Studio wiring
        run: |
          node --check studio/razor-all-engine.js
          node --check studio/razor-all-integration.js
          node studio/test_razor_all.mjs
          grep -q "razor-all-engine.js" studio/feature-bootstrap.js
          grep -q "razor-all-integration.js" studio/feature-bootstrap.js
          grep -q "Shift+S" studio/razor-all-integration.js

      - name: Verify grouped atomic clip clipboard and track remapping
        run: |
          node --check studio/clip-clipboard-engine.js
          node --check studio/timeline-paste-extension.js
          node studio/test_clip_clipboard.mjs
          node studio/test_timeline_paste_extension.mjs

      - name: Verify atomic insert and overwrite media placement
        run: |
          node --check studio/media-placement-engine.js
          node --check studio/media-placement-integration.js
          node studio/test_media_placement.mjs
          node studio/test_media_placement_atomicity.mjs
          grep -q "media-placement-engine.js" studio/feature-bootstrap.js
          grep -q "media-placement-integration.js" studio/feature-bootstrap.js

      - name: Verify source monitor ranges, probed duration and legacy media identity
        run: node studio/test_source_monitor.mjs

      - name: Verify Match Frame source mapping and canonical media identity
        run: node studio/test_match_frame.mjs

      - name: Verify source-aware left trim
        run: node studio/test_timeline_left_trim.mjs

      - name: Verify source-aware right trim
        run: node studio/test_timeline_right_trim.mjs

      - name: Verify resilient filmstrip thumbnails across timeline rerenders
        run: node studio/test_filmstrip.mjs

      - name: Verify social safe-area delivery guard and Studio wiring
        run: |
          node --check studio/safe-area-engine.js
          node --check studio/safe-area-integration.js
          node --check studio/generator-integration.js
          node studio/test_safe_area_engine.mjs
          grep -q "bootSafeArea" studio/generator-integration.js
          grep -q "safe-area-engine.js" studio/generator-integration.js
          grep -q "safe-area-integration.js" studio/generator-integration.js
          grep -q "safeAreaPlatform" studio/safe-area-integration.js
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|api[_-]?key|billing' studio/safe-area-engine.js studio/safe-area-integration.js

      - name: Verify local SRT and VTT subtitle export and Studio wiring
        run: |
          node --check studio/subtitle-export-engine.js
          node --check studio/subtitle-export-integration.js
          node --check studio/generator-integration.js
          node studio/test_subtitle_export.mjs
          grep -q "subtitle-export-engine.js" studio/generator-integration.js
          grep -q "subtitle-export-integration.js" studio/generator-integration.js
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|api[_-]?key|billing' studio/subtitle-export-engine.js studio/subtitle-export-integration.js

      - name: Verify timeline waveform source-window parity and media replacement cache safety
        run: node studio/test_waveform_timeline_parity.mjs

      - name: Verify resilient project library persistence and last-good recovery
        run: |
          node --check studio/project-library.js
          node studio/test_project_library.mjs
          node studio/test_project_library_recovery.mjs
          ! grep -Eiq 'stripe|openai|runway|replicate|cloudinary|firebase|supabase|api[_-]?key|bearer[[:space:]]' studio/project-library.js

      - name: Verify transactional project undo redo history
        run: |
          node studio/test_project_history_engine.mjs
          grep -q "project-history-engine.js" studio/feature-bootstrap.js
          grep -q "project-history-integration.js" studio/feature-bootstrap.js
          grep -q "#undoBtn" studio/project-history-integration.js
          grep -q "#redoBtn" studio/project-history-integration.js
          grep -q "stopImmediatePropagation" studio/project-history-integration.js
          grep -q "ProfitMenteProjectHistory?.reset" studio/project-library.js

      - name: Verify continuous strict project autosave persistence
        run: node studio/test_project_autosave.mjs

      - name: Verify safe project switching
        run: node studio/test_project_switch_wiring.mjs

      - name: Verify active project is flushed before reopen
        run: node studio/test_project_reopen_flush_order.mjs

      - name: Verify cross-project media library cleanup and deletion safety
        run: node studio/test_media_library_cross_project_guard.mjs

      - name: Verify media library remains bound after inspector renderer
        run: node studio/test_media_library_inspector_rebind.mjs

      - name: Verify safe media replacement and legacy duration recovery
        run: node studio/test_media_replace_engine.mjs

      - name: Verify generator and autofill canonical identities
        run: node studio/test_generator_identity.mjs

      - name: Verify local-library automatic generator refill and zero-cost wiring
        run: |
          node --check studio/generator-refill-integration.js
          node --check studio/test_generator_refill.mjs
          node studio/test_generator_refill.mjs
          grep -Fq "generator-refill-integration.js" studio/feature-bootstrap.js
          grep -Fq "ProfitMenteGeneratorRefill" studio/generator-refill-integration.js
          grep -Fq "project?.mode!=='Automático'" studio/generator-refill-integration.js
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|elevenlabs|api[_-]?key|billing' studio/generator-refill-integration.js

      - name: Verify manual batch transitions, locks and legacy identities
        run: node studio/test_manual_transition_engine.mjs

      - name: Verify atomic batch color grading and Studio wiring
        run: |
          node --check studio/color-grade-engine.js
          node --check studio/color-grade-batch-engine.js
          node --check studio/color-grade-batch-integration.js
          node studio/test_color_grade.mjs
          node studio/test_color_grade_batch.mjs
          grep -q "color-grade-batch-engine.js" studio/color-grade-engine.js
          grep -q "color-grade-batch-integration.js" studio/color-grade-engine.js
          grep -q "ProfitMenteColorGradeBatch" studio/color-grade-batch-integration.js

      - name: Verify render progress backend, frontend and zero-cost wiring
        run: |
          python -m py_compile studio/render_progress.py studio/render_bundle.py studio/render_motion_text.py studio/studio_server.py studio/test_render_progress.py
          python studio/test_render_progress.py
          node --check studio/render-job-integration.js
          node --check studio/bundle-render-job-integration.js
          node --check studio/render-progress-engine.js
          node --check studio/render-progress-integration.js
          node --check studio/feature-bootstrap.js
          node studio/test_render_progress_engine.js
          grep -q 'PROFITMENTE_PROGRESS_FILE' studio/render_progress.py
          grep -q 'render_progress_phases' studio/studio_server.py
          grep -q 's.phase' studio/render-job-integration.js
          grep -q 'profitmente:render-progress' studio/bundle-render-job-integration.js
          grep -q "emitProgress('rendering'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('qa'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('downloading'" studio/bundle-render-job-integration.js
          grep -q "emitProgress('done'" studio/bundle-render-job-integration.js
          grep -q 'render-progress-engine.js' studio/feature-bootstrap.js
          grep -q 'render-progress-integration.js' studio/feature-bootstrap.js
          ! grep -Eiq 'stripe|openai|runway|replicate|elevenlabs|api[_-]?key|billing' studio/render-progress-engine.js studio/render-progress-integration.js

      - name: Verify recoverable preserved render sessions and error UX
        run: |
          node --check studio/render-error-engine.js
          node --check studio/render-job-client.js
          node --check studio/render-job-integration.js
          node --check studio/render-recovery-integration.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_render_recovery_integration.js
          node studio/test_render_recovery_integration.js
          grep -q "render-error-engine.js','ProfitMenteRenderErrorEngine" studio/feature-bootstrap.js
          grep -q "render-recovery-integration.js','ProfitMenteRenderRecovery" studio/feature-bootstrap.js
          grep -q 'resumeSavedJob' studio/render-recovery-integration.js
          grep -q 'recoverRenderBtn' studio/render-recovery-integration.js
          grep -q 'profitmente.activeRenderJob.v1' studio/render-job-integration.js
          ! grep -Eiq 'stripe|openai|runway|replicate|elevenlabs|api[_-]?key|billing' studio/render-recovery-integration.js studio/render-error-engine.js

      - name: Verify async MP4 recovery, post-QA and render snapshot freshness
        run: node studio/test_async_render_validation.mjs

      - name: Verify audio waveform identity and track safety
        run: node studio/test_audio_waveform_engine.mjs

      - name: Verify core audio preview identity safety
        run: node studio/test_audio_engine_identity.mjs

      - name: Verify Smart Mix automation and legacy audio state safety
        run: node studio/test_smart_mix_engine.mjs

      - name: Verify automatic beat detection
        run: node studio/test_beat_detect_engine.mjs

      - name: Verify automatic beat synchronization
        run: node studio/test_beat_sync_engine.mjs

      - name: Verify WebM final resolution, bitrate and render-state safety
        run: node studio/test_webm_render_state.mjs

      - name: Verify WebM render edit lock and project mutation guard
        run: |
          node --check studio/webm-render-engine.js
          node --check studio/webm-render-integration.js
          node studio/test_webm_render_edit_lock.mjs

      - name: Verify browser-local WebM quality control
        run: |
          node --check studio/webm-qc-engine.js
          node --check studio/webm-render-integration.js
          node studio/test_webm_qc.mjs
          ! grep -Eri 'stripe|runway|openai\.com|api\.openai|anthropic|elevenlabs|paid api|subscription' studio/webm-qc-engine.js studio/webm-render-integration.js

      - name: Verify temporal audio ducking in final MP4
        run: python studio/test_audio_ducking_render.py

      - name: Verify audio envelopes and fades in final MP4
        run: python studio/test_audio_envelope_render.py

      - name: Verify final MP4 fully decodes
        run: python studio/test_verify_render_decode.py

      - name: Verify black, silence and freeze signal QC
        run: python studio/test_output_signal_qc.py

      - name: Verify final audio loudness QC
        run: python studio/test_output_loudness_qc.py

      - name: Verify ProfitMente Studio $0 release
        run: python studio/verify_zero_cost_release.py
