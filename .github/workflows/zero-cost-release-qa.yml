name: ProfitMente Studio Zero Cost Release QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/zero-cost-release-qa.yml'
  workflow_dispatch:

jobs:
  zero-cost-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify clip inspector lock and identity safety
        run: node studio/test_clip_lock_track_inspector.mjs

      - name: Verify safe QA report rendering
        run: node studio/test_qa_report_safe_render.mjs

      - name: Verify safe timeline rendering
        run: node studio/test_timeline_safe_render.mjs

      - name: Verify timeline magnetic snapping and canonical clip identity
        run: node studio/test_timeline_snap.mjs

      - name: Verify source monitor ranges, probed duration and legacy media identity
        run: node studio/test_source_monitor.mjs

      - name: Verify Match Frame source mapping and canonical media identity
        run: node studio/test_match_frame.mjs

      - name: Verify source-aware left trim
        run: node studio/test_timeline_left_trim.mjs

      - name: Verify source-aware right trim
        run: node studio/test_timeline_right_trim.mjs

      - name: Verify resilient filmstrip thumbnails across timeline rerenders
        run: node studio/test_filmstrip.mjs

      - name: Verify resilient project library persistence
        run: node studio/test_project_library.mjs

      - name: Verify safe project switching
        run: node studio/test_project_switch_wiring.mjs

      - name: Verify active project is flushed before reopen
        run: node studio/test_project_reopen_flush_order.mjs

      - name: Verify safe media replacement and legacy duration recovery
        run: node studio/test_media_replace_engine.mjs

      - name: Verify audio waveform identity and track safety
        run: node studio/test_audio_waveform_engine.mjs

      - name: Verify core audio preview identity safety
        run: node studio/test_audio_engine_identity.mjs

      - name: Verify automatic beat detection
        run: node studio/test_beat_detect_engine.mjs

      - name: Verify automatic beat synchronization
        run: node studio/test_beat_sync_engine.mjs

      - name: Verify temporal audio ducking in final MP4
        run: python studio/test_audio_ducking_render.py

      - name: Verify audio envelopes and fades in final MP4
        run: python studio/test_audio_envelope_render.py

      - name: Verify ProfitMente Studio $0 release
        run: python studio/verify_zero_cost_release.py
