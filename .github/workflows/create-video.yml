name: Crear Video ProfitMenteTV
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Buscar videos reales para las escenas
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python broll.py
      - name: Crear video final
        run: python generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ProfitMenteTV-video
          path: |
            output/ProfitMenteTV.mp4
            assets/broll/credits.json
          retention-days: 7
