name: Crear Video ProfitMenteTV
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
concurrency:
  group: profitmentetv-video
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar motor de video
        run: pip install -r requirements.txt
      - name: Verificar configuración v4
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python preflight.py
      - name: Buscar B-roll vertical Full HD
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python broll.py
      - name: Validar B-roll antes de editar
        run: |
          set -e
          for n in 1 2 3 4 5 6; do
            test -s "assets/broll/scene_${n}.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration -of default=nw=1 "assets/broll/scene_${n}.mp4"
          done
      - name: Renderizar ProfitMenteTV v4 profesional
        run: python generate.py
      - name: Control de calidad MP4
        run: |
          set -e
          test -s output/ProfitMenteTV.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate -of json output/ProfitMenteTV.mp4 | tee output/render_report.json
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/ProfitMenteTV.mp4 | grep -q '720,1280'
      - name: Crear paquete de revisión
        if: success()
        run: |
          cp video.json output/video_used.json
          cp scenes.json output/scenes_used.json
      - name: Subir video final y diagnóstico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProfitMenteTV-v4-review
          path: |
            output/ProfitMenteTV.mp4
            output/render_report.json
            output/video_used.json
            output/scenes_used.json
            assets/broll/credits.json
          if-no-files-found: warn
          retention-days: 7
