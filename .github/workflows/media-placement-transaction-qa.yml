name: ProfitMente Studio Media Placement Transaction QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/media-placement-engine.js'
      - 'studio/media-placement-integration.js'
      - 'studio/test_media_placement_transaction.mjs'
      - '.github/workflows/media-placement-transaction-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-placement-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check studio/media-placement-engine.js
          node --check studio/media-placement-integration.js
          node --check studio/test_media_placement_transaction.mjs
      - name: Placement transaction regression
        run: node studio/test_media_placement_transaction.mjs
      - name: Verify atomic integration wiring
        run: |
          grep -q 'engine.transaction(project' studio/media-placement-integration.js
          grep -q "reason:'add-clip-failed'" studio/media-placement-integration.js
          grep -q 'persistState();redraw()' studio/media-placement-integration.js
      - name: Zero cost boundary
        run: |
          ! grep -Eiq 'stripe|openai|runway|replicate|elevenlabs|api[_-]?key|authorization:|bearer ' studio/media-placement-engine.js studio/media-placement-integration.js studio/test_media_placement_transaction.mjs
