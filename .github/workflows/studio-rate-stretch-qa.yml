name: ProfitMente Studio Rate Stretch QA
on:
  push:
    paths:
      - 'studio/rate-stretch-engine.js'
      - 'studio/rate-stretch-integration.js'
      - 'studio/test_rate_stretch.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/studio-rate-stretch-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/rate-stretch-engine.js
          node --check studio/rate-stretch-integration.js
          node --check studio/feature-bootstrap.js
      - name: Rate stretch regression
        run: node studio/test_rate_stretch.mjs
