name: ProfitMente Studio Track Mixer QA

on:
  push:
    paths:
      - 'studio/track-mixer-engine.js'
      - 'studio/track-mixer-integration.js'
      - 'studio/track-mixer-render-integration.js'
      - 'studio/audio-engine.js'
      - 'studio/render_mp4.py'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_track_mixer.mjs'
      - '.github/workflows/track-mixer-qa.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          node --check studio/track-mixer-engine.js
          node --check studio/track-mixer-integration.js
          node --check studio/track-mixer-render-integration.js
          node --check studio/audio-engine.js
          python -m py_compile studio/render_mp4.py
      - name: Track mixer regression
        run: node studio/test_track_mixer.mjs
