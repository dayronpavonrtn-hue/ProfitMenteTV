name: ProfitMente Studio Generator Metadata Sync QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/generator-autofill.js'
      - 'studio/media-metadata-engine.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_generator_metadata_sync.mjs'
      - 'studio/verify_zero_cost_release.py'
      - '.github/workflows/generator-metadata-sync-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-metadata-sync-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free render dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: |
          node --check studio/generator-autofill.js
          node --check studio/media-metadata-engine.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_generator_metadata_sync.mjs
      - name: Generator metadata synchronization regression
        run: node studio/test_generator_metadata_sync.mjs
      - name: Verify bootstrap order
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('studio/feature-bootstrap.js').read_text()
          assert text.index("media-metadata-engine.js") < text.index("generator-autofill.js")
          print('metadata loads before generator autofill: ok')
          PY
      - name: Zero-cost boundary
        run: |
          ! grep -Eiq 'openai|runway|magic.?hour|stripe|api[_-]?key|authorization:|bearer ' studio/generator-autofill.js studio/test_generator_metadata_sync.mjs
      - name: Full ProfitMente Studio $0 release gate
        run: python studio/verify_zero_cost_release.py
