name: ProfitMente Studio Visual Gap QA

on:
  push:
    paths:
      - 'studio/visual-gap-engine.js'
      - 'studio/visual-gap-integration.js'
      - 'studio/generator-integration.js'
      - 'studio/test_visual_gap_engine.mjs'
      - '.github/workflows/visual-gap-qa.yml'
  workflow_dispatch:

jobs:
  visual-gap-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check gap engine
        run: node --check studio/visual-gap-engine.js
      - name: Syntax check gap integration
        run: node --check studio/visual-gap-integration.js
      - name: Syntax check generator integration
        run: node --check studio/generator-integration.js
      - name: Test visual gap detection and fill
        run: node studio/test_visual_gap_engine.mjs
      - name: Verify Studio loads gap engine
        run: grep -q "visual-gap-engine.js" studio/generator-integration.js
      - name: Verify Studio loads gap integration
        run: grep -q "visual-gap-integration.js" studio/generator-integration.js
      - name: Verify automatic import hook
        run: grep -q "profitmente:media-imported" studio/visual-gap-integration.js
