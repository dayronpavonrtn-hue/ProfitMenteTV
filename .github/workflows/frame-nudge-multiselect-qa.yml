name: ProfitMente Studio Frame Nudge Multi-Select QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/frame-nudge-engine.js'
      - 'studio/frame-nudge-integration.js'
      - 'studio/selection-integration.js'
      - 'studio/test_frame_nudge_multiselect.mjs'
      - '.github/workflows/frame-nudge-multiselect-qa.yml'
  workflow_dispatch:

jobs:
  frame-nudge-multiselect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript syntax
        run: |
          node --check studio/frame-nudge-engine.js
          node --check studio/frame-nudge-integration.js
          node --check studio/selection-integration.js
          node --check studio/test_frame_nudge_multiselect.mjs
      - name: Verify atomic frame nudge across multi-selection and linked groups
        run: node studio/test_frame_nudge_multiselect.mjs
      - name: Verify selection API bridge and multi-select wiring
        run: |
          grep -q 'applySelection(project,ids,frames)' studio/frame-nudge-integration.js
          grep -q 'selected(){return engine.values()}' studio/selection-integration.js
          grep -q 'clear(){const values=engine.clear()' studio/selection-integration.js
          grep -q 'set(ids){const values=engine.set(ids)' studio/selection-integration.js
      - name: Verify zero-cost boundary
        run: |
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|fal\.ai|elevenlabs|api[_-]?key|billing' studio/frame-nudge-engine.js studio/frame-nudge-integration.js studio/selection-integration.js
