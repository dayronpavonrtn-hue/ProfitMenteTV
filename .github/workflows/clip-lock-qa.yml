name: ProfitMente Studio Clip Lock QA
on:
  push:
    paths:
      - 'studio/clip-lock-*.js'
      - 'studio/clip-inspector.js'
      - 'studio/group-edit-engine.js'
      - 'studio/group-split-engine.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_clip_lock.mjs'
      - 'studio/test_clip_lock_track_inspector.mjs'
      - '.github/workflows/clip-lock-qa.yml'
  workflow_dispatch:
jobs:
  clip-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/clip-lock-engine.js
          node --check studio/clip-lock-integration.js
          node --check studio/clip-inspector.js
          node --check studio/group-edit-engine.js
          node --check studio/group-split-engine.js
      - name: Clip lock regression
        run: node studio/test_clip_lock.mjs
      - name: Locked track inspector regression
        run: node studio/test_clip_lock_track_inspector.mjs
      - name: Existing group edit regression
        run: node studio/test_group_edit.mjs
      - name: Existing group split regression
        run: node studio/test_group_split.mjs
      - name: Feature bootstrap regression
        run: node studio/test_feature_bootstrap.mjs
