name: ProfitMente Studio Preview Frame Step QA

on:
  push:
    paths:
      - 'studio/preview-frame-step-engine.js'
      - 'studio/preview-frame-step-integration.js'
      - 'studio/test_preview_frame_step.mjs'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/preview-frame-step-qa.yml'
  workflow_dispatch:

jobs:
  preview-frame-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/preview-frame-step-engine.js
          node --check studio/preview-frame-step-integration.js
          node --check studio/feature-bootstrap.js
      - name: Verify frame-accurate preview navigation
        run: node studio/test_preview_frame_step.mjs
      - name: Verify bootstrap wiring
        run: |
          grep -q "preview-frame-step-engine.js" studio/feature-bootstrap.js
          grep -q "preview-frame-step-integration.js" studio/feature-bootstrap.js
