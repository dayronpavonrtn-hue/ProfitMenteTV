name: ProfitMente Studio Timeline Snap QA

on:
  push:
    paths:
      - 'studio/timeline-snap-engine.js'
      - 'studio/timeline-snap-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_timeline_snap.mjs'
      - '.github/workflows/timeline-snap-qa.yml'
  pull_request:
    paths:
      - 'studio/timeline-snap-engine.js'
      - 'studio/timeline-snap-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_timeline_snap.mjs'
      - '.github/workflows/timeline-snap-qa.yml'

jobs:
  timeline-snap-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/timeline-snap-engine.js
          node --check studio/timeline-snap-integration.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_timeline_snap.mjs
      - name: Timeline snap regression
        run: node studio/test_timeline_snap.mjs
