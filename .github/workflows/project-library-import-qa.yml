name: ProfitMente Studio Project Library Import QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/project-library.js'
      - 'studio/test_project_library_numeric_import.mjs'
      - '.github/workflows/project-library-import-qa.yml'
  pull_request:
    paths:
      - 'studio/project-library.js'
      - 'studio/test_project_library_numeric_import.mjs'
      - '.github/workflows/project-library-import-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-library-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check project library
        run: node --check studio/project-library.js
      - name: Strict numeric import regression
        run: node studio/test_project_library_numeric_import.mjs
