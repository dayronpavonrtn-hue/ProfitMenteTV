name: ProfitMente Studio Preview Stale Frame QA

on:
  push:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/test_preview_stale_frames.mjs'
      - '.github/workflows/preview-stale-frame-qa.yml'
  workflow_dispatch:

jobs:
  preview-stale-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview syntax
        run: node --check studio/preview-engine.js
      - name: Run stale-frame regression
        run: node studio/test_preview_stale_frames.mjs
