name: ProfitMente Studio Preview Stale Frame QA

on:
  push:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/motion-text-engine.js'
      - 'studio/caption-preview.js'
      - 'studio/test_preview_stale_frames.mjs'
      - 'studio/test_motion_preview_stale_frames.mjs'
      - 'studio/test_caption_preview_stale_frames.mjs'
      - '.github/workflows/preview-stale-frame-qa.yml'
  workflow_dispatch:

jobs:
  preview-stale-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview syntax
        run: |
          node --check studio/preview-engine.js
          node --check studio/motion-text-engine.js
          node --check studio/caption-preview.js
          node --check studio/test_preview_stale_frames.mjs
          node --check studio/test_motion_preview_stale_frames.mjs
          node --check studio/test_caption_preview_stale_frames.mjs
      - name: Run stale-frame regressions
        run: |
          node studio/test_preview_stale_frames.mjs
          node studio/test_motion_preview_stale_frames.mjs
          node studio/test_caption_preview_stale_frames.mjs
