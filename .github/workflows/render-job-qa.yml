name: ProfitMente Studio Render Job QA

on:
  push:
    paths:
      - 'studio/render-job-client.js'
      - 'studio/render-job-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/export-preflight.js'
      - 'studio/studio_server.py'
      - 'studio/generator-integration.js'
      - 'studio/test_render_job_client.mjs'
      - 'studio/test_render_job_recovery.mjs'
      - 'studio/test_render_project_identity.mjs'
      - 'studio/test_render_preflight_gate.mjs'
      - 'studio/test_server_api.py'
      - '.github/workflows/render-job-qa.yml'
  workflow_dispatch:

jobs:
  render-job-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check studio/render-job-client.js
          node --check studio/render-job-integration.js
          node --check studio/feature-bootstrap.js
          node --check studio/export-preflight.js
          node --check studio/generator-integration.js
          node --check studio/test_render_job_recovery.mjs
          node --check studio/test_render_project_identity.mjs
          node --check studio/test_render_preflight_gate.mjs
      - name: Check Python syntax
        run: python -m py_compile studio/studio_server.py
      - name: Test render job client
        run: node studio/test_render_job_client.mjs
      - name: Test render recovery after reload
        run: node studio/test_render_job_recovery.mjs
      - name: Test render project identity
        run: node studio/test_render_project_identity.mjs
      - name: Test canonical MP4 preflight gate
        run: node studio/test_render_preflight_gate.mjs
      - name: Test local server API
        working-directory: studio
        run: python test_server_api.py
      - name: Verify render job support is loaded
        run: |
          grep -q "render-job-client.js" studio/generator-integration.js
          grep -q "/api/render/jobs" studio/studio_server.py
