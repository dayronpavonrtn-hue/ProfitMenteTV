name: ProfitMente Studio Project Duplicate QA

on:
  push:
    paths:
      - 'studio/project-library.js'
      - 'studio/test_project_library.mjs'
      - '.github/workflows/project-duplicate-qa.yml'
  workflow_dispatch:

jobs:
  project-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check studio/project-library.js
      - name: Project library duplication regression
        run: node studio/test_project_library.mjs
