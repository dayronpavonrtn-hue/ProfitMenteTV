name: ProfitMente Studio Preview Parity QA

on:
  push:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/render_mp4.py'
      - 'studio/caption-preview.js'
      - 'studio/test_preview_track_state.mjs'
      - 'studio/test_preview_keyframe_parity.mjs'
      - 'studio/test_preview_overlap_order.mjs'
      - 'studio/test_preview_media_identity.mjs'
      - '.github/workflows/preview-parity-qa.yml'
  workflow_dispatch:

jobs:
  preview-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check preview syntax
        run: node --check studio/preview-engine.js && node --check studio/caption-preview.js
      - name: Test preview track state and transition parity
        run: node studio/test_preview_track_state.mjs
      - name: Test preview keyframe parity
        run: node studio/test_preview_keyframe_parity.mjs
      - name: Test preview and MP4 overlap order parity
        run: node studio/test_preview_overlap_order.mjs
      - name: Test preview media identity parity
        run: node studio/test_preview_media_identity.mjs
