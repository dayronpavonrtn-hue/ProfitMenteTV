name: ProfitMente Studio JKL Shuttle Transport QA

on:
  push:
    paths:
      - 'studio/transport-engine.js'
      - 'studio/shuttle-transport-engine.js'
      - 'studio/shuttle-transport-integration.js'
      - 'studio/test_transport_engine.mjs'
      - 'studio/test_shuttle_transport_engine.mjs'
      - '.github/workflows/shuttle-transport-qa.yml'
  workflow_dispatch:

jobs:
  shuttle-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/transport-engine.js
          node --check studio/shuttle-transport-engine.js
          node --check studio/shuttle-transport-integration.js
      - name: Verify resilient transport
        run: node studio/test_transport_engine.mjs
      - name: Verify strict JKL shuttle transport
        run: node studio/test_shuttle_transport_engine.mjs
      - name: Verify runtime wiring
        run: |
          grep -q "shuttle-transport-engine.js" studio/transport-engine.js
          grep -q "shuttle-transport-integration.js" studio/transport-engine.js
