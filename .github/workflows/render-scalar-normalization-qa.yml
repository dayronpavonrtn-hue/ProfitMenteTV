name: ProfitMente Studio Render Scalar Normalization QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/track_state_render.py'
      - 'studio/media_identity.py'
      - 'studio/render_mp4.py'
      - 'studio/caption_render_timing.py'
      - 'studio/test_track_state_render_scalars.py'
      - 'studio/test_caption_absolute_render_timing.py'
      - 'studio/test_motion_text_render_zero.py'
      - 'studio/test_render_clip_boolean_flags.py'
      - '.github/workflows/render-scalar-normalization-qa.yml'
  pull_request:
    paths:
      - 'studio/track_state_render.py'
      - 'studio/media_identity.py'
      - 'studio/render_mp4.py'
      - 'studio/caption_render_timing.py'
      - 'studio/test_track_state_render_scalars.py'
      - 'studio/test_caption_absolute_render_timing.py'
      - 'studio/test_motion_text_render_zero.py'
      - 'studio/test_render_clip_boolean_flags.py'
      - '.github/workflows/render-scalar-normalization-qa.yml'

jobs:
  render-scalar-normalization-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile studio/track_state_render.py studio/render_mp4.py studio/caption_render_timing.py studio/test_track_state_render_scalars.py studio/test_caption_absolute_render_timing.py studio/test_motion_text_render_zero.py studio/test_render_clip_boolean_flags.py
      - name: Render scalar regression
        working-directory: studio
        run: python test_track_state_render_scalars.py
      - name: Caption absolute/relative render timing regression
        working-directory: studio
        run: python test_caption_absolute_render_timing.py
      - name: Motion text zero-coordinate render regression
        working-directory: studio
        run: python test_motion_text_render_zero.py
      - name: Strict render clip flag regression
        working-directory: studio
        run: python test_render_clip_boolean_flags.py
