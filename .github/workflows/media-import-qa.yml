name: ProfitMente Studio Media Import QA

on:
  push:
    paths:
      - 'studio/media-import-engine.js'
      - 'studio/media-library-tools.js'
      - 'studio/media-timeline-dnd.js'
      - 'studio/media-store.js'
      - 'studio/app.js'
      - 'studio/index.html'
      - 'studio/generator-autofill.js'
      - 'studio/generator-integration.js'
      - 'studio/test_media_import_engine.mjs'
      - 'studio/test_media_import_empty_guard.mjs'
      - 'studio/test_media_timeline_dnd.mjs'
      - 'studio/test_media_store.mjs'
      - 'studio/test_generator_autofill.mjs'
      - '.github/workflows/media-import-qa.yml'
  workflow_dispatch:

jobs:
  media-import-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check import engine
        run: node --check studio/media-import-engine.js
      - name: Syntax check library integration
        run: node --check studio/media-library-tools.js
      - name: Syntax check timeline drag drop
        run: node --check studio/media-timeline-dnd.js
      - name: Syntax check resilient media store
        run: |
          node --check studio/media-store.js
          node --check studio/app.js
          node --check studio/test_media_store.mjs
      - name: Syntax check generator autofill
        run: node --check studio/generator-autofill.js
      - name: Syntax check generator integration
        run: node --check studio/generator-integration.js
      - name: Test classification and deduplication
        run: node studio/test_media_import_engine.mjs
      - name: Test empty media rejection
        run: node studio/test_media_import_empty_guard.mjs
      - name: Test timeline media placement
        run: node studio/test_media_timeline_dnd.mjs
      - name: Test resilient browser media storage
        run: node studio/test_media_store.mjs
      - name: Test automatic refill after import
        run: node studio/test_generator_autofill.mjs
      - name: Verify importer is loaded by Studio library
        run: grep -q "media-import-engine.js" studio/media-library-tools.js
      - name: Verify timeline drag drop is loaded by importer
        run: grep -q "media-timeline-dnd.js" studio/media-import-engine.js
      - name: Verify generator autofill is loaded
        run: grep -q "generator-autofill.js" studio/generator-integration.js
      - name: Verify importer emits automation event
        run: grep -q "profitmente:media-imported" studio/media-import-engine.js
