name: ProfitMente Studio Media Import QA

on:
  push:
    paths:
      - 'studio/media-import-engine.js'
      - 'studio/media-library-tools.js'
      - 'studio/test_media_import_engine.mjs'
      - '.github/workflows/media-import-qa.yml'
  workflow_dispatch:

jobs:
  media-import-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check import engine
        run: node --check studio/media-import-engine.js
      - name: Syntax check library integration
        run: node --check studio/media-library-tools.js
      - name: Test classification and deduplication
        run: node studio/test_media_import_engine.mjs
      - name: Verify importer is loaded by Studio library
        run: grep -q "media-import-engine.js" studio/media-library-tools.js
