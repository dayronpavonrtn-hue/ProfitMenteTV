name: ProfitMente Studio Recovery Storage Fallback QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/recovery-engine.js'
      - 'studio/tests/recovery-storage-fallback-regression.js'
      - '.github/workflows/recovery-storage-fallback-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-storage-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check recovery engine
        run: node --check studio/recovery-engine.js
      - name: Verify storage failure fallback and recovery
        run: node studio/tests/recovery-storage-fallback-regression.js
