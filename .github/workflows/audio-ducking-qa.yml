name: ProfitMente Studio Audio Ducking QA

on:
  push:
    paths:
      - 'studio/audio-ducking-engine.js'
      - 'studio/audio-ducking-integration.js'
      - 'studio/audio-engine.js'
      - 'studio/render-job-integration.js'
      - 'studio/index.html'
      - 'studio/test_audio_ducking.mjs'
      - '.github/workflows/audio-ducking-qa.yml'
  workflow_dispatch:

jobs:
  audio-ducking-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check ducking engine
        run: node --check studio/audio-ducking-engine.js
      - name: Syntax check preview audio
        run: node --check studio/audio-engine.js
      - name: Syntax check inspector integration
        run: node --check studio/audio-ducking-integration.js
      - name: Syntax check render integration
        run: node --check studio/render-job-integration.js
      - name: Test time-aware ducking and render segmentation
        run: node studio/test_audio_ducking.mjs
      - name: Verify Studio loads ducking before audio engine
        run: grep -q 'audio-ducking-engine.js.*audio-engine.js' studio/index.html
      - name: Verify MP4 path prepares render project
        run: grep -q 'ProfitMenteAudioDuckingEngine.prepareForRender(value)' studio/render-job-integration.js
