name: ProfitMente Studio Project Autosave QA

on:
  push:
    paths:
      - 'studio/project-autosave.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_project_autosave.mjs'
      - '.github/workflows/project-autosave-qa.yml'
  pull_request:
    paths:
      - 'studio/project-autosave.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_project_autosave.mjs'
      - '.github/workflows/project-autosave-qa.yml'

jobs:
  autosave-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/project-autosave.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_project_autosave.mjs
      - name: Project autosave regression
        run: node studio/test_project_autosave.mjs
