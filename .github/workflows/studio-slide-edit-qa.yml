name: ProfitMente Studio Slide Edit QA
on:
  push:
    paths:
      - 'studio/slide-edit-engine.js'
      - 'studio/slide-edit-integration.js'
      - 'studio/test_slide_edit.mjs'
      - 'studio/slip-edit-integration.js'
      - 'studio/roll-edit-integration.js'
      - 'studio/feature-bootstrap.js'
      - '.github/workflows/studio-slide-edit-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/slide-edit-engine.js
          node --check studio/slide-edit-integration.js
          node --check studio/slip-edit-integration.js
          node --check studio/roll-edit-integration.js
          node --check studio/feature-bootstrap.js
      - name: Slide edit regression
        run: node studio/test_slide_edit.mjs
      - name: Verify feature wiring and exclusive shortcuts
        run: |
          grep -F "['slide-edit-engine.js','ProfitMenteSlideEditEngine']" studio/feature-bootstrap.js
          grep -F "['slide-edit-integration.js','ProfitMenteSlideEdit']" studio/feature-bootstrap.js
          grep -F "if(!e.altKey||e.shiftKey)return" studio/slip-edit-integration.js
          grep -F "if(!e.shiftKey||!e.altKey)return" studio/roll-edit-integration.js