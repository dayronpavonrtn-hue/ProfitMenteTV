name: ProfitMente Studio Filmstrip QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/filmstrip-engine.js'
      - 'studio/test_filmstrip.mjs'
      - '.github/workflows/studio-filmstrip-qa.yml'
  pull_request:
    paths:
      - 'studio/filmstrip-engine.js'
      - 'studio/test_filmstrip.mjs'
      - '.github/workflows/studio-filmstrip-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filmstrip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Timeline filmstrip regression
        run: node studio/test_filmstrip.mjs
