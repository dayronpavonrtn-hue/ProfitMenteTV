name: ProfitMente Studio Ripple Trim QA
on:
  push:
    paths:
      - 'studio/ripple-trim-engine.js'
      - 'studio/ripple-trim-integration.js'
      - 'studio/remove-time-integration.js'
      - 'studio/test_ripple_trim.mjs'
      - '.github/workflows/ripple-trim-qa.yml'
  workflow_dispatch:
jobs:
  ripple-trim-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/ripple-trim-engine.js
          node --check studio/ripple-trim-integration.js
          node --check studio/remove-time-integration.js
      - name: Ripple trim regression
        run: node studio/test_ripple_trim.mjs
      - name: Verify Studio wiring
        run: |
          grep -q "ripple-trim-engine.js" studio/remove-time-integration.js
          grep -q "ripple-trim-integration.js" studio/remove-time-integration.js
          grep -q "rippleTrimBtn" studio/ripple-trim-integration.js