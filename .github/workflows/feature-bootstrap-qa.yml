name: ProfitMente Studio Feature Bootstrap QA

on:
  push:
    paths:
      - 'studio/feature-bootstrap.js'
      - 'studio/transition-duration.js'
      - 'studio/qa-report-integration.js'
      - 'studio/test_feature_bootstrap.mjs'
      - 'studio/test_qa_report_safe_render.mjs'
      - '.github/workflows/feature-bootstrap-qa.yml'
  pull_request:
    paths:
      - 'studio/feature-bootstrap.js'
      - 'studio/transition-duration.js'
      - 'studio/qa-report-integration.js'
      - 'studio/test_feature_bootstrap.mjs'
      - 'studio/test_qa_report_safe_render.mjs'

jobs:
  feature-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/feature-bootstrap.js
          node --check studio/transition-duration.js
          node --check studio/qa-report-integration.js
          node --check studio/test_feature_bootstrap.mjs
          node --check studio/test_qa_report_safe_render.mjs
      - name: Bootstrap regression
        run: node studio/test_feature_bootstrap.mjs
      - name: Safe QA report regression
        run: node studio/test_qa_report_safe_render.mjs
