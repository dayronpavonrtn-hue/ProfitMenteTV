name: ProfitMente Studio $0 Full Release Gate

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'tools/**'
      - '.github/workflows/studio-zero-cost-full-release.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'tools/**'
      - '.github/workflows/studio-zero-cost-full-release.yml'
  workflow_dispatch:

concurrency:
  group: studio-zero-cost-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-local-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify free render dependencies
        run: |
          node --version
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run complete ProfitMente Studio $0 gate
        run: python studio/verify_zero_cost_release_full.py
