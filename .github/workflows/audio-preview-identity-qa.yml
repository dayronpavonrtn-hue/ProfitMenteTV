name: ProfitMente Studio Audio Preview Identity QA

on:
  push:
    paths:
      - 'studio/audio-engine.js'
      - 'studio/render_audio_mix.py'
      - 'studio/track_state_render.py'
      - 'studio/test_audio_preview_identity.mjs'
      - 'studio/test_render_audio_track_identity.py'
      - '.github/workflows/audio-preview-identity-qa.yml'
  pull_request:
    paths:
      - 'studio/audio-engine.js'
      - 'studio/render_audio_mix.py'
      - 'studio/track_state_render.py'
      - 'studio/test_audio_preview_identity.mjs'
      - 'studio/test_render_audio_track_identity.py'
      - '.github/workflows/audio-preview-identity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-preview-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          node --version
          python3 --version
      - name: Syntax
        run: |
          node --check studio/audio-engine.js
          python3 -m py_compile studio/render_audio_mix.py studio/track_state_render.py studio/test_render_audio_track_identity.py
      - name: Audio preview identity regression
        run: node studio/test_audio_preview_identity.mjs
      - name: Audio render track identity regression
        run: python3 studio/test_render_audio_track_identity.py
      - name: Verify zero-cost boundary
        run: |
          ! grep -Ei "https?://|api[_-]?key|stripe|openai|anthropic|replicate" studio/render_audio_mix.py studio/test_render_audio_track_identity.py
