name: ProfitMente Studio Media Readability QA

on:
  push:
    paths:
      - 'studio/media-inspector.js'
      - 'studio/qa-engine.js'
      - 'studio/media-relink-engine.js'
      - 'studio/test_media_readability_qa.mjs'
      - 'studio/test_media_integrity_qa.mjs'
      - '.github/workflows/media-readability-qa.yml'
  workflow_dispatch:

jobs:
  media-readability-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check studio/media-inspector.js
          node --check studio/qa-engine.js
          node --check studio/media-relink-engine.js
      - name: Media readability regression
        run: node studio/test_media_readability_qa.mjs
      - name: Media identity regression
        run: node studio/test_media_integrity_qa.mjs
      - name: Verify QA integration
        run: |
          grep -q "mediaReadable===false" studio/qa-engine.js
          grep -q "mediaIdKey" studio/qa-engine.js
          grep -q "mediaReadable" studio/media-relink-engine.js
          grep -q "this.version=2" studio/media-inspector.js
