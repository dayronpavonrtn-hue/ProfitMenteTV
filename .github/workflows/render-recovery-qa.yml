name: ProfitMente Studio Render Recovery QA

on:
  push:
    paths:
      - 'studio/render-error-engine.js'
      - 'studio/render-job-client.js'
      - 'studio/render-job-integration.js'
      - 'studio/render-recovery-integration.js'
      - 'studio/feature-bootstrap.js'
      - 'studio/test_render_recovery_integration.js'
      - '.github/workflows/render-recovery-qa.yml'
  workflow_dispatch:

jobs:
  render-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend syntax
        run: |
          node --check studio/render-error-engine.js
          node --check studio/render-job-client.js
          node --check studio/render-job-integration.js
          node --check studio/render-recovery-integration.js
          node --check studio/feature-bootstrap.js
          node --check studio/test_render_recovery_integration.js
      - name: Render recovery regression
        run: node studio/test_render_recovery_integration.js
      - name: Recovery wiring guard
        run: |
          grep -q "render-error-engine.js','ProfitMenteRenderErrorEngine" studio/feature-bootstrap.js
          grep -q "render-recovery-integration.js','ProfitMenteRenderRecovery" studio/feature-bootstrap.js
          grep -q 'resumeSavedJob' studio/render-recovery-integration.js
          grep -q 'recoverRenderBtn' studio/render-recovery-integration.js
          grep -q 'profitmente.activeRenderJob.v1' studio/render-job-integration.js
      - name: Zero-cost recovery guard
        run: |
          ! grep -Eiq 'stripe|openai|runway|replicate|elevenlabs|api[_-]?key|billing' studio/render-recovery-integration.js studio/render-error-engine.js
