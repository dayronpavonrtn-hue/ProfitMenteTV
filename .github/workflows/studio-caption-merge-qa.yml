name: ProfitMente Studio Caption Merge QA

on:
  push:
    branches: [main]
    paths:
      - 'studio/caption-merge-engine.js'
      - 'studio/caption-merge-integration.js'
      - 'studio/caption-timing-integration.js'
      - 'studio/test_caption_merge.mjs'
      - '.github/workflows/studio-caption-merge-qa.yml'
  workflow_dispatch:

jobs:
  caption-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check studio/caption-merge-engine.js
          node --check studio/caption-merge-integration.js
          node --check studio/caption-timing-integration.js
      - name: Run caption merge regressions
        run: node studio/test_caption_merge.mjs
      - name: Verify Studio wiring and zero-cost boundary
        run: |
          grep -q "caption-merge-engine.js" studio/caption-timing-integration.js
          grep -q "caption-merge-integration.js" studio/caption-timing-integration.js
          grep -q "ciMergeNextCaption" studio/caption-merge-integration.js
          ! grep -Eiq 'stripe|openai|anthropic|runway|replicate|api[_-]?key|billing' studio/caption-merge-engine.js studio/caption-merge-integration.js
