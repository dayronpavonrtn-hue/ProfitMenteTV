name: ProfitMente Studio Preview Strict Timing QA

on:
  push:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/test_preview_strict_timing.mjs'
      - '.github/workflows/preview-strict-timing-qa.yml'
  pull_request:
    paths:
      - 'studio/preview-engine.js'
      - 'studio/test_preview_strict_timing.mjs'
      - '.github/workflows/preview-strict-timing-qa.yml'
  workflow_dispatch:

jobs:
  preview-strict-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview engine syntax
        run: node --check studio/preview-engine.js
      - name: Run strict preview timing regression
        run: node studio/test_preview_strict_timing.mjs
