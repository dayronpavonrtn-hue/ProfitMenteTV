<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProfitMente Studio</title><link rel="stylesheet" href="style.css"></head><body><header><b>ProfitMente Studio</b><span class="badge">$0 MODE</span><button id="autoBtn">⚡ Automático</button><button id="manualBtn">✂ Manual</button><button class="export" id="exportBtn">Exportar proyecto</button></header><main><aside><h3>Biblioteca</h3><input id="mediaInput" type="file" accept="video/*,image/*,audio/*" multiple hidden><button id="uploadBtn">＋ Subir media</button><div id="mediaLibrary" class="tabs">Sin archivos</div><h3>IA / Automatización</h3><button id="sceneBtn">Generar estructura</button><button id="captionBtn">Subtítulos</button><button id="brollBtn">B-roll</button><p class="tabs">Los módulos premium permanecerán desactivados mientras estemos en $0 MODE.</p></aside><section class="workspace"><div class="top"><div class="preview"><div class="phone"><div class="screen"><div class="brand">PROFITMENTE TV</div><video id="previewVideo" controls playsinline hidden></video><img id="previewImage" hidden><h1 id="placeholder">Tu video aparecerá aquí</h1><p>9:16 · 1080×1920</p></div></div></div><div class="props"><h3>Propiedades</h3><label>Proyecto<input id="projectName" value="Nuevo video"></label><label>Formato<select id="format"><option value="9:16">9:16 Short / Reel / TikTok</option><option value="16:9">16:9 YouTube</option><option value="1:1">1:1 Social</option></select></label><label>Modo<select id="mode"><option>Automático</option><option>Manual</option></select></label><label>Duración<input id="duration" type="number" min="1" value="45"></label><button id="saveBtn">Guardar proyecto</button></div></div><div class="timeline"><div class="timelineHead"><b>Timeline multicapa · doble clic para añadir clip</b><span id="timeLabel">00:00 / 00:45</span></div><div id="tracks"></div></div></section></main><script src="app.js"></script></body></html>
